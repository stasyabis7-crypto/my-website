name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert uploaded PNG and update references
        run: npm run images:prepare

      - name: Check components, design system and local links
        run: npm run check

      - name: Version gallery assets for the hosting CDN
        run: node scripts/version-gallery-assets.js

      - name: Deploy to Hostinger hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 82.198.228.23
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /domains/stasyabis.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            dev/**
            docs/**
            **/scripts/**
            **/node_modules/**
            **/.claude/**
            **/config.php
            assets/garden/flowers-src/**
            assets/garden/flowers new/**
            _*.html
            package.json
            **/*.png
            **/*.PNG
            **/*.md
            **/baseline.json
            **/.DS_Store
            **/.gitkeep

      - name: Verify published HTML cache policy
        run: node scripts/check-html-cache.js
