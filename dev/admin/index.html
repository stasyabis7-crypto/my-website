<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админка сайта</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/webp" href="/components/site-brand/favicon.webp" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Локальная админка: работает только через npm run admin (docs/admin.md). -->
  <header class="bar">
    <div class="bar__brand">stasyabis <span>админка</span></div>
    <nav class="bar__tabs" aria-label="Разделы админки">
      <button type="button" data-tab="home">Главная</button>
      <button type="button" data-tab="pages">Страницы</button>
      <button type="button" data-tab="links">Ссылки и файлы</button>
      <button type="button" data-tab="publish">Публикация <span class="bar__count" id="dirty-count" hidden></span></button>
    </nav>
    <div class="bar__actions">
      <button type="button" class="ui-btn" id="undo" disabled title="Отменить последнее действие (⌘Z)">↶ Отменить</button>
      <a class="ui-btn" href="/index.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
    </div>
  </header>
  <main id="view"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>Админке нужен JavaScript.</noscript>
  <script src="blocks.js"></script>
  <script src="admin.js"></script>
</body>
</html>
