<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пожертвование — анимация интерфейса</title>
  <style>
    :root {
      --canvas: #bebfc1;
      --phone-w: 460px;
      --phone-h: calc(var(--phone-w) * 849 / 418);
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in: cubic-bezier(.7, 0, .84, 0);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
    }

    body {
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .viewport {
      position: relative;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      overflow: hidden;
      background: var(--canvas);
    }

    .canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--canvas);
      transform-origin: 0 0;
    }

    .phone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--phone-w);
      height: var(--phone-h);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 28px 46px rgba(25, 28, 31, .18));
      isolation: isolate;
    }

    .device-shell {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .screen-blank {
      position: absolute;
      z-index: 1;
      left: 5.263%;
      top: 2.238%;
      width: 89.713%;
      height: 95.642%;
      border-radius: 53px;
      background: #fff;
    }

    .persistent-status {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      object-fit: contain;
      clip-path: inset(0 0 92% 0);
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      will-change: opacity;
    }

    .screen.is-current { opacity: 1; }

    .slice {
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity;
    }

    .slice img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slice:nth-child(1) { clip-path: inset(0 0 82% 0); }
    .slice:nth-child(2) { clip-path: inset(16% 0 66% 0); }
    .slice:nth-child(3) { clip-path: inset(32% 0 49% 0); }
    .slice:nth-child(4) { clip-path: inset(49% 0 31% 0); }
    .slice:nth-child(5) { clip-path: inset(68% 0 13% 0); }
    .slice:nth-child(6) { clip-path: inset(85% 0 0 0); }

    .tap {
      position: absolute;
      z-index: 20;
      left: 50%;
      width: 58px;
      height: 58px;
      margin: -29px 0 0 -29px;
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.72), rgba(255,255,255,.22) 48%, rgba(255,255,255,.08) 72%),
        rgba(255,255,255,.16);
      box-shadow:
        0 10px 28px rgba(30, 35, 39, .18),
        inset 0 1px 0 rgba(255,255,255,.75);
      backdrop-filter: blur(10px) saturate(145%);
      -webkit-backdrop-filter: blur(10px) saturate(145%);
      pointer-events: none;
      will-change: opacity, transform;
    }

    .tap::after {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: inherit;
      background: rgba(255,255,255,.34);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    }

    .tap.at-primary { top: 91.1%; }
    .tap.at-payment { top: 91.1%; }

    @media (prefers-reduced-motion: reduce) {
      .screen, .slice, .tap {
        transition: none !important;
        animation: none !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="viewport" aria-label="Демонстрация процесса пожертвования">
    <div class="canvas">
      <div class="phone" id="phone">
        <img class="device-shell" src="./donate-flow-1.png" alt="">
        <div class="screen-blank" aria-hidden="true"></div>
        <img class="persistent-status" src="./donate-flow-1.png" alt="">

        <section class="screen" data-screen="0" aria-label="Выбор фонда и суммы">
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-1.png" alt=""></div>
        </section>

        <section class="screen" data-screen="1" aria-label="Выбор способа оплаты">
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-2.png" alt=""></div>
        </section>

        <section class="screen" data-screen="2" aria-label="Пожертвование отправлено">
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
          <div class="slice"><img src="./donate-flow-3.png" alt=""></div>
        </section>

        <div class="tap" id="tap" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.querySelector('.canvas');
    const screens = [...document.querySelectorAll('.screen')];
    const tap = document.querySelector('#tap');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let runId = 0;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function fitCanvas() {
      const viewport = document.querySelector('.viewport');
      const scale = Math.min(viewport.clientWidth, viewport.clientHeight) / 1080;
      canvas.style.transform = `scale(${scale})`;
    }

    function animate(element, keyframes, options) {
      if (reduceMotion) {
        const last = keyframes[keyframes.length - 1];
        Object.assign(element.style, last);
        return { finished: Promise.resolve() };
      }
      return element.animate(keyframes, { fill: 'forwards', ...options });
    }

    async function revealScreen(index, token) {
      const screen = screens[index];
      screen.classList.add('is-current');
      animate(screen, [
        { opacity: 0 },
        { opacity: 1 }
      ], { duration: 260, easing: 'linear' });

      const slices = [...screen.querySelectorAll('.slice')];
      slices.forEach(slice => {
        animate(slice, [
          { opacity: 0 },
          { opacity: 1 }
        ], {
          duration: 980,
          delay: 80,
          easing: 'cubic-bezier(.22, .61, .36, 1)'
        });
      });
      await sleep(1200);
      return token === runId;
    }

    async function hideScreen(index) {
      const screen = screens[index];
      const slices = [...screen.querySelectorAll('.slice')];
      slices.forEach((slice, i) => {
        animate(slice, [
          { opacity: 1 },
          { opacity: 0 }
        ], {
          duration: 380,
          delay: (slices.length - 1 - i) * 24,
          easing: 'ease-in-out'
        });
      });
      animate(screen, [
        { opacity: 1 },
        { opacity: 0 }
      ], { duration: 520, easing: 'ease-in-out' });
      await sleep(540);
      screen.classList.remove('is-current');
    }

    async function pressButton(kind) {
      tap.className = `tap ${kind}`;
      await animate(tap, [
        { opacity: 0, transform: 'scale(.55)' },
        { opacity: 1, transform: 'scale(1.05)', offset: .48 },
        { opacity: 1, transform: 'scale(1)' }
      ], { duration: 420, easing: 'cubic-bezier(.16, 1, .3, 1)' }).finished;

      await animate(tap, [
        { opacity: 1, transform: 'scale(1)' },
        { opacity: .94, transform: 'scale(.78)', offset: .38 },
        { opacity: .76, transform: 'scale(1.13)', offset: .68 },
        { opacity: 0, transform: 'scale(1.42)' }
      ], { duration: 520, easing: 'cubic-bezier(.2, .8, .2, 1)' }).finished;
    }

    function clearScreens() {
      screens.forEach(screen => {
        screen.getAnimations().forEach(animation => animation.cancel());
        screen.querySelectorAll('.slice').forEach(slice => {
          slice.getAnimations().forEach(animation => animation.cancel());
          slice.removeAttribute('style');
        });
        screen.classList.remove('is-current');
        screen.removeAttribute('style');
      });
      tap.getAnimations().forEach(animation => animation.cancel());
      tap.removeAttribute('style');
    }

    async function playLoop() {
      const token = ++runId;
      while (token === runId) {
        clearScreens();
        await revealScreen(0, token);
        await sleep(1450);
        await pressButton('at-primary');
        await sleep(140);
        await hideScreen(0);

        await revealScreen(1, token);
        await sleep(1450);
        await pressButton('at-payment');
        await sleep(140);
        await hideScreen(1);

        await revealScreen(2, token);
        await sleep(2500);
        await hideScreen(2);
        await sleep(420);
      }
    }

    addEventListener('resize', fitCanvas);
    fitCanvas();

    Promise.all(
      [...document.images].map(img => img.complete
        ? Promise.resolve()
        : new Promise(resolve => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          }))
    ).then(playLoop);
  </script>
</body>
</html>
