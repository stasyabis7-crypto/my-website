<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Портрет покупателя</title>
<style>  body,.viewport,.canvas{transition:background-color .3s ease}
  :root{color-scheme:light dark;--ink:rgba(0,17,34,.95);--muted:rgba(0,17,34,.66);--line:rgba(97,131,162,.26);--blue:#5ccafa;--pink:#ff95b8;--ease:cubic-bezier(.16,1,.3,1)}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
  body{display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:var(--ink)}
  .canvas{position:absolute;left:50%;top:50%;width:1000px;height:667px;transform:translate(-50%,-50%);transform-origin:center;background:transparent;display:grid;place-items:center}
  .card{position:relative;width:904px;height:490px;padding:24px;border:0;border-radius:24px;background:#fff;overflow:hidden;opacity:0;transform:translateY(14px) scale(1.035);animation:card-in .75s var(--ease) .08s forwards}
  .heading{position:absolute;left:24px;right:24px;top:23px}
  .title-row{display:flex;align-items:flex-start;gap:8px}
  h1{margin:0;font-size:17px;line-height:22px;font-weight:600;letter-spacing:0}
  .info{width:16px;height:16px;margin-top:3px;opacity:0;transform:scale(.5) rotate(-25deg);animation:info-in .55s var(--ease) .72s forwards}
  .subtitle{margin:4px 0 0;font-size:15px;line-height:24px;font-weight:400}
  .charts{position:absolute;left:24px;right:24px;top:103px;height:328px;display:grid;grid-template-columns:210px 1fr;gap:20px}
  .chart{position:relative;height:100%}
  .plot{position:absolute;left:0;right:0;top:0;height:296px;display:flex;align-items:flex-end}
  .gender .plot{justify-content:space-around;padding:0 10px}
  .ages .plot{justify-content:space-around}
  .axis{position:absolute;left:0;right:0;top:295px;height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;animation:axis-in .65s var(--ease) .58s forwards}
  .column{position:relative;height:296px;display:flex;align-items:flex-end;justify-content:center}
  .gender .column{width:84px}.ages .column{width:94px}
  .stack{position:relative;width:64px;transform:scaleY(0);transform-origin:bottom;animation:bar-in .92s var(--ease) var(--delay) forwards}
  .segment{display:block;width:100%;min-width:100%}.segment:first-of-type{border-radius:2px 2px 0 0}
  .stacked .segment:first-of-type{border-radius:0}
  .blue{background:var(--blue)}.pink{background:var(--pink)}
  .stacked{display:flex;flex-direction:column;gap:4px}
  .stacked .segment{flex-shrink:0}
  .stacked .blue{border:0}
  .value{position:absolute;left:50%;top:-24px;transform:translate(-50%,8px);color:var(--muted);font-size:15px;line-height:20px;white-space:nowrap;opacity:0;animation:value-in .5s ease-out calc(var(--delay) + .48s) forwards}
  .tick{position:absolute;left:50%;top:295px;width:4px;height:4px;border-left:1px solid var(--line);transform:translateX(-50%);opacity:0;animation:fade-in .25s ease calc(var(--delay) - .06s) forwards}
  .label{position:absolute;left:50%;top:304px;transform:translateX(-50%);color:var(--muted);font-size:13px;line-height:16px;white-space:nowrap;opacity:0;animation:label-in .42s ease-out calc(var(--delay) + .16s) forwards;font-feature-settings:"lnum" 1,"tnum" 1}
  .footnote{position:absolute;left:24px;bottom:23px;margin:0;color:var(--muted);font-size:13px;line-height:20px;opacity:0;transform:translateY(6px);animation:foot-in .5s ease-out 1.45s forwards}
  @keyframes card-in{to{opacity:1;transform:scale(1.05)}}
  @keyframes axis-in{to{transform:scaleX(1)}}
  @keyframes bar-in{0%{transform:scaleY(0)}70%{transform:scaleY(1.035)}100%{transform:scaleY(1)}}
  @keyframes value-in{to{opacity:1;transform:translate(-50%,0)}}
  @keyframes label-in{to{opacity:1;transform:translate(-50%,0)}}
  @keyframes foot-in{to{opacity:1;transform:translateY(0)}}
  @keyframes fade-in{to{opacity:1}}
  @keyframes info-in{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.card,.info,.axis,.stack,.value,.tick,.label,.footnote{animation-duration:.01ms;animation-delay:0s}}
</style>
  <script src="../shared/theme-sync.js" defer></script>
</head>
<body>
<main class="canvas">
  <section class="card" aria-label="Портрет покупателей сегмента">
    <header class="heading">
      <div class="title-row"><h1>В сегменте на 8,54% больше женщин, чем мужчин</h1><img class="info" src="info.svg" alt=""></div>
      <p class="subtitle">Возраст большинства покупателей сегмента от 25 до 34 лет</p>
    </header>
    <div class="charts">
      <div class="chart gender">
        <div class="plot">
          <div class="column" style="--delay:.72s"><div class="stack" style="height:197px"><span class="value">45,27%</span><span class="segment blue" style="height:197px"></span></div><i class="tick"></i><span class="label">Мужчины</span></div>
          <div class="column" style="--delay:.84s"><div class="stack" style="height:246px"><span class="value">54,27%</span><span class="segment pink" style="height:246px"></span></div><i class="tick"></i><span class="label">Женщины</span></div>
        </div>
        <i class="axis"></i>
      </div>
      <div class="chart ages">
        <div class="plot">
          <div class="column" style="--delay:.96s"><div class="stack stacked" style="height:212px"><span class="value">54,27%</span><span class="segment blue" style="height:104px"></span><span class="segment pink" style="height:104px"></span></div><i class="tick"></i><span class="label">&lt;18</span></div>
          <div class="column" style="--delay:1.04s"><div class="stack stacked" style="height:81px"><span class="value">0,13%</span><span class="segment blue" style="height:38px"></span><span class="segment pink" style="height:39px"></span></div><i class="tick"></i><span class="label">18 – 24</span></div>
          <div class="column" style="--delay:1.12s"><div class="stack stacked" style="height:153px"><span class="value">54,27%</span><span class="segment blue" style="height:97px"></span><span class="segment pink" style="height:52px"></span></div><i class="tick"></i><span class="label">25 – 34</span></div>
          <div class="column" style="--delay:1.20s"><div class="stack stacked" style="height:276px"><span class="value">54,27%</span><span class="segment blue" style="height:136px"></span><span class="segment pink" style="height:136px"></span></div><i class="tick"></i><span class="label">35 – 44</span></div>
          <div class="column" style="--delay:1.28s"><div class="stack stacked" style="height:101px"><span class="value">54,27%</span><span class="segment blue" style="height:48px"></span><span class="segment pink" style="height:49px"></span></div><i class="tick"></i><span class="label">45 – 54</span></div>
          <div class="column" style="--delay:1.36s"><div class="stack stacked" style="height:229px"><span class="value">54,27%</span><span class="segment blue" style="height:112px"></span><span class="segment pink" style="height:113px"></span></div><i class="tick"></i><span class="label">&gt;55</span></div>
        </div>
        <i class="axis"></i>
      </div>
    </div>
    <p class="footnote">Данные о 84.25% покупателей сегмента</p>
  </section>
</main>
<script>
  const canvas=document.querySelector('.canvas');
  function fit(){canvas.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1000,innerHeight/667)})`}
  addEventListener('resize',fit);fit();

  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    let card=document.querySelector('.card');
    setInterval(()=>{
      const freshCard=card.cloneNode(true);
      card.replaceWith(freshCard);
      card=freshCard;
    },4000);
  }
</script>
</body>
</html>
