<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Смена темы — #яПомогаю</title>
  <style>
    @font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
    :root{--canvas-width:1080;--canvas-height:1080;--canvas-bg:#111217;--ease:cubic-bezier(.22,.61,.36,1)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--canvas-bg);font-family:"CoFo Avito Text",Arial,sans-serif}
    body{display:grid;place-items:center}
    .viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--canvas-bg);transition:background 1s var(--ease)}
    .viewport.theme-0{--canvas-bg:#111217}
    .viewport.theme-1{--canvas-bg:#dff7f0}
    .viewport.theme-2{--canvas-bg:#f9e4d8}
    .viewport.theme-3{--canvas-bg:#d9eef0}
    .ambient{position:absolute;inset:-18%;opacity:.72;filter:blur(80px);transition:background 1s var(--ease),opacity 1s var(--ease)}
    .theme-0 .ambient{background:radial-gradient(circle at 22% 42%,#502d8b 0,transparent 34%),radial-gradient(circle at 78% 58%,#6e1721 0,transparent 34%)}
    .theme-1 .ambient{background:radial-gradient(circle at 22% 28%,#b9e9ff 0,transparent 35%),radial-gradient(circle at 80% 72%,#d9ffd0 0,transparent 36%),#eff7ef}
    .theme-2 .ambient{background:radial-gradient(circle at 72% 20%,#fff2bd 0,transparent 35%),radial-gradient(circle at 20% 82%,#ffdfe2 0,transparent 34%),#f9e4d8}
    .theme-3 .ambient{background:radial-gradient(circle at 20% 25%,#c8ffe2 0,transparent 34%),radial-gradient(circle at 82% 22%,#ffe0de 0,transparent 38%),linear-gradient(135deg,#c5eafa,#f4f0e6)}
    .canvas{position:absolute;left:50%;top:50%;width:1080px;height:1080px;transform-origin:center}
    .phone{position:absolute;left:50%;top:50%;width:460px;height:934px;transform:translate(-50%,-50%);border-radius:78px;background:linear-gradient(110deg,#777,#f6f4e9 18%,#777 42%,#e8e5d8 72%,#777);padding:7px;box-shadow:0 28px 62px rgba(15,20,25,.22)}
    .bezel{position:relative;width:100%;height:100%;padding:10px;border-radius:72px;background:#090909;overflow:hidden}
    .display{position:relative;width:100%;height:100%;border-radius:61px;background:#fff;overflow:hidden;transition:background .9s var(--ease)}
    .theme-0 .display{background:#0a0a0a}.theme-1 .display{background:#eef8f5}.theme-2 .display{background:#fcece3}.theme-3 .display{background:#eef4ef}
    .status{position:absolute;z-index:20;inset:0 0 auto;height:58px;background:transparent;color:#000;font-size:16px;font-weight:700;transition:color .8s var(--ease)}
    .status.dark{color:#fff}
    .time{position:absolute;left:59px;top:22px}
    .island{position:absolute;left:50%;top:12px;width:126px;height:37px;transform:translateX(-50%);border-radius:24px;background:#000}
    .camera{position:absolute;right:14px;top:11px;width:10px;height:10px;border-radius:50%;background:#0b1324;box-shadow:inset 0 0 3px #3153a4}
    .levels{position:absolute;right:0;top:24px;width:138px;height:13px;display:block;transition:filter .8s var(--ease)}
    .status.dark .levels{filter:invert(1)}
    .screens{position:absolute;inset:0}
    .screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .95s var(--ease),visibility 0s linear .95s;overflow:hidden}
    .screen.active{opacity:1;visibility:visible;transition-delay:0s}
    .screen-inner{position:absolute;left:50%;top:0;width:375px;height:812px;transform:translateX(-50%) scale(1.136);transform-origin:top center;color:var(--text);background-color:var(--screen-bg);background-position:center;background-repeat:no-repeat;background-size:375px 812px;overflow:hidden}
    .theme-screen-0{--text:#e3e3e3;--screen-bg:#0a0a0a;background:radial-gradient(circle at 0 48%,#30205c 0,transparent 37%),radial-gradient(circle at 100% 58%,#5d151c 0,transparent 35%),#0a0a0a}
    .theme-screen-1{--text:#000;--screen-bg:#fff;background:radial-gradient(circle at -8% 28%,#ffdce0 0,transparent 33%),radial-gradient(circle at 105% 35%,#d9ffd0 0,transparent 36%),radial-gradient(circle at 14% 88%,#beeaff 0,transparent 39%),#fff}
    .theme-screen-2{--text:#000;--screen-bg:#fcece3;background:radial-gradient(circle at 82% 18%,#fff5c9 0,transparent 34%),radial-gradient(circle at 0 100%,#ffe7e8 0,transparent 34%),#fcece3}
    .theme-screen-3{--text:#000;--screen-bg:#eef4ef;background:radial-gradient(circle at 0 20%,#c8ffe2 0,transparent 36%),radial-gradient(circle at 100% 22%,#ffe1df 0,transparent 38%),linear-gradient(120deg,#c5eafa,#f4f0e6)}
    .brand{position:absolute;top:60px;left:50%;width:99px;height:27px;display:block;transform:translateX(-50%)}
    .brand img{display:block;width:99px;height:27px}
    .close{position:absolute;right:18px;top:59px;width:24px;height:24px;color:var(--text)}
    .close:before,.close:after{content:"";position:absolute;left:11px;top:1px;width:2px;height:22px;background:currentColor;border-radius:2px;transform:rotate(45deg)}
    .close:after{transform:rotate(-45deg)}
    .content{position:absolute;left:18px;right:18px;top:113px;text-align:center}
    h1{margin:0;font-size:32px;line-height:1.08;letter-spacing:-.45px;font-weight:700}
    .description{margin:11px auto 0;max-width:340px;font-size:15px;line-height:1.42;font-weight:400}
    .illustration{position:absolute;left:0;width:375px;height:auto;display:block;object-fit:contain}
    .state-0 .illustration{top:357px}
    .state-1 .illustration{bottom:99px}
    .state-2 .illustration{top:346px}
    .state-3 .illustration{bottom:105px}
    .cta{position:absolute;left:10px;right:10px;bottom:43px;height:52px;border:0;border-radius:14px;background:var(--button);color:#fff;font:400 15px/1 "CoFo Avito Text",Arial,sans-serif}
    .state-0{--button:#04c454}.state-1,.state-3{--button:#0af}.state-2{--button:#000}
    .home{position:absolute;z-index:30;bottom:9px;left:50%;width:134px;height:5px;border-radius:4px;background:#000;transform:translateX(-50%);transition:background .8s var(--ease)}
    .home.dark{background:#fff}
    @media(prefers-reduced-motion:reduce){.screen,.viewport,.status,.levels,.home{transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="viewport theme-0">
  <div class="ambient"></div>
  <div class="canvas">
    <div class="phone">
      <div class="bezel">
        <div class="display">
          <div class="status dark">
            <span class="time">9:41</span>
            <div class="island"><i class="camera"></i></div>
            <img class="levels" src="assets/levels.svg" alt="">
          </div>
          <div class="screens">
            <section class="screen active state-0"><div class="screen-inner theme-screen-0">
              <div class="brand"><img src="assets/logo-dark.svg" alt="Avito"></div><span class="close"></span>
              <div class="content"><h1 data-i18n="title"></h1><p class="description" data-i18n="description"></p></div>
              <img class="illustration" src="assets/theme-1.webp" alt=""><button class="cta" data-i18n="cta"></button>
            </div></section>
            <section class="screen state-1"><div class="screen-inner theme-screen-1">
              <div class="brand"><img src="assets/logo.svg" alt="Avito"></div><span class="close"></span>
              <div class="content"><h1 data-i18n="title"></h1><p class="description" data-i18n="description"></p></div>
              <img class="illustration" src="assets/theme-2.webp" alt=""><button class="cta" data-i18n="cta"></button>
            </div></section>
            <section class="screen state-2"><div class="screen-inner theme-screen-2">
              <div class="brand"><img src="assets/logo-red.svg" alt="Avito"></div><span class="close"></span>
              <div class="content"><h1 data-i18n="title"></h1><p class="description" data-i18n="description"></p></div>
              <img class="illustration" src="assets/theme-3.webp" alt=""><button class="cta" data-i18n="cta"></button>
            </div></section>
            <section class="screen state-3"><div class="screen-inner theme-screen-3">
              <div class="brand"><img src="assets/logo-black.svg" alt="Avito"></div><span class="close"></span>
              <div class="content"><h1 data-i18n="title"></h1><p class="description" data-i18n="description"></p></div>
              <img class="illustration" src="assets/theme-4.webp" alt=""><button class="cta" data-i18n="cta"></button>
            </div></section>
          </div>
          <div class="home dark"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
{
  const copy={
    ru:{title:'#яПомогаю —\nпрямо сейчас',description:'Каждый год Авито направляет на помощь окружающим более 70 млн рублей. Присоединяйся к проекту #яПомогаю, и сделай чью-то жизнь лучше вместе с нами.',cta:'Хочу помочь'},
    en:{title:'#IHelp —\nright now',description:'Every year Avito directs more than 70 million rubles to help others. Join the #IHelp project and make someone’s life better together with us.',cta:'I want to help'}
  };
  const hangingWords={ru:['а','без','в','во','да','для','до','за','и','из','или','к','ко','либо','на','над','не','ни','но','о','об','от','по','под','при','про','с','со','у','через'],en:['a','an','and','as','at','by','for','from','in','of','on','or','the','to','with']};
  function removeHangingWords(value,language){const words=hangingWords[language].join('|');return value.replace(new RegExp('(^|[\\s(«„“])('+words+')\\s+(?=\\S)','giu'),(_,prefix,word)=>prefix+word+'\u00a0');}
  const params=new URLSearchParams(location.search);let lang=(params.get('lang')||document.documentElement.lang||'ru').toLowerCase().startsWith('en')?'en':'ru';
  function applyLanguage(next){lang=next==='en'?'en':'ru';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=removeHangingWords(copy[lang][node.dataset.i18n],lang);});}
  window.phoneAnimationSetLanguage=applyLanguage;applyLanguage(lang);
  const viewport=document.querySelector('.viewport'),canvas=document.querySelector('.canvas'),screens=[...document.querySelectorAll('.screen')],status=document.querySelector('.status'),home=document.querySelector('.home');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));let generation=0;
  function fit(){const scale=Math.min(viewport.clientWidth/1080,viewport.clientHeight/1080);canvas.style.transform=`translate(-50%,-50%) scale(${scale})`;}
  function showTheme(index){screens.forEach((screen,i)=>screen.classList.toggle('active',i===index));viewport.className=`viewport theme-${index}`;status.classList.toggle('dark',index===0);home.classList.toggle('dark',index===0);}
  async function runLoop(){const id=++generation;while(id===generation){for(let i=0;i<screens.length;i++){showTheme(i);await wait(2800);if(id!==generation)return;}}}
  addEventListener('resize',fit);fit();runLoop();
}
</script>
</body>
</html>
