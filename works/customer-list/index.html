<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Список покупателей</title>
<style>
:root{--blue:#005bff;--ink:rgba(0,17,34,.95);--secondary:rgba(0,17,34,.66);--muted:rgba(0,17,34,.56);--field:rgba(97,131,162,.1);--line:rgba(97,131,162,.2);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--blue);font-family:Inter,Arial,sans-serif;color:var(--ink)}
.stage{position:absolute;left:50%;top:50%;width:1000px;height:563px;transform:translate(-50%,-50%);transform-origin:center;background:var(--blue);overflow:hidden}
.popup{position:absolute;left:50%;top:50%;width:467px;height:353px;padding:24px 12px 8px;border-radius:8px;background:#fff;box-shadow:0 8px 16px -2px rgba(0,0,0,.12),0 0 2px rgba(0,0,0,.12);transform:translate(-50%,-50%);transition:transform .32s var(--ease),opacity .25s}
h1{margin:0 0 12px;font-size:15px;line-height:20px;font-weight:600}.field{height:44px;border-radius:8px;background:var(--field);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:15px;line-height:20px;position:relative}.field strong{color:var(--ink);font-weight:400}.chevron{margin-left:auto;width:9px;height:9px;border-right:2px solid #85909b;border-bottom:2px solid #85909b;transform:rotate(45deg) translateY(-2px)}
.label{margin:20px 2px 4px;color:var(--secondary);font-size:15px;line-height:20px}.amount{display:grid;grid-template-columns:64px 1fr;gap:4px}.operator{border-radius:8px 0 0 8px}.operator .chevron{margin-left:10px}.quantity{height:44px;border-radius:0 8px 8px 0;background:var(--field);padding:4px 10px}.quantity small{display:block;color:var(--secondary);font-size:13px;line-height:16px}.quantity span{display:block;font-size:15px;line-height:20px}
.period-label{margin-top:20px}.periods{display:grid;grid-template-columns:40px 40px 40px 40px 1fr;gap:8px}.period{height:44px;border-radius:8px;background:var(--field);display:grid;place-items:center;color:var(--secondary);font-size:15px;transition:.2s}.period.selected{background:#dbe8ff;color:var(--blue);box-shadow:inset 0 0 0 2px #2f83ff}.other{display:flex;align-items:center;padding:0 10px;white-space:nowrap}.calendar{margin-left:auto;width:16px;height:16px;border:2px solid #94a0ac;border-radius:3px;position:relative}.calendar:before{content:"";position:absolute;left:-2px;right:-2px;top:3px;border-top:2px solid #94a0ac}.divider{height:1px;background:var(--line);margin-top:20px}.actions{display:flex;gap:8px;padding-top:12px}.button{height:32px;padding:0 14px;border:0;border-radius:6px;font:600 15px Inter,Arial;color:#fff;background:var(--blue);transition:transform .14s,filter .14s}.button.secondary{background:var(--field);color:var(--blue)}.button.pressed{transform:scale(.95);filter:brightness(.92)}
.menu{position:absolute;z-index:5;left:12px;right:12px;top:103px;padding:6px;border-radius:8px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(-5px) scale(.98);pointer-events:none;transition:.22s var(--ease)}.menu.show{opacity:1;transform:none}.option{height:38px;padding:0 10px;border-radius:6px;display:flex;align-items:center;font-size:15px}.option.hover{background:var(--field);color:var(--blue)}
.op-menu{position:absolute;z-index:6;left:12px;top:190px;width:64px;padding:4px;border-radius:8px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(-4px);transition:.2s var(--ease)}.op-menu.show{opacity:1;transform:none}.op-option{height:32px;border-radius:5px;display:grid;place-items:center;font-size:15px}.op-option.hover{background:var(--field);color:var(--blue)}
.cursor{position:absolute;z-index:20;left:0;top:0;width:24px;height:24px;pointer-events:none;transform-origin:4px 3px;will-change:transform,opacity}.cursor.pointer{opacity:0}
.pulse{position:absolute;z-index:19;width:34px;height:34px;border:2px solid rgba(255,255,255,.9);border-radius:50%;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.55)}.pulse.hit{animation:hit .45s ease-out}@keyframes hit{0%{opacity:.9;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
@media(prefers-reduced-motion:reduce){.cursor,.pulse{display:none}.popup,.menu,.op-menu,.period,.button{transition:none}}
</style></head><body><main class="stage">
<section class="popup" id="popup"><h1>Что сделали покупатели с вашими товарами</h1>
<div class="field" id="actionField"><span id="actionText">Действие покупателя</span><i class="chevron"></i></div>
<div class="menu" id="actionMenu"><div class="option">Добавили в избранное</div><div class="option" id="targetAction">Добавили в корзину</div><div class="option">Купили товар</div></div>
<p class="label">Сколько товаров</p><div class="amount"><div class="field operator" id="operatorField"><strong id="operatorText">≥</strong><i class="chevron"></i></div><div class="quantity" id="quantityField"><small>Количество товаров</small><span id="quantityText">1</span></div></div>
<div class="op-menu" id="operatorMenu"><div class="op-option">=</div><div class="op-option" id="targetOperator">≥</div><div class="op-option">≤</div></div>
<p class="label period-label">За какой период, дней</p><div class="periods"><div class="period" id="periodOne">1</div><div class="period" id="periodTwo">2</div><div class="period" id="periodThree">3</div><div class="period" id="periodFour">4</div><div class="period other" id="periodOther"><span id="otherText">Другой период</span><i class="calendar"></i></div></div>
<div class="divider"></div><div class="actions"><button class="button" id="apply">Применить</button><button class="button secondary" id="clear">Очистить</button></div></section>
<img class="cursor" id="cursor" src="assets/cursor-default.svg" alt=""><img class="cursor pointer" id="pointer" src="assets/cursor-pointer.svg" alt=""><i class="pulse" id="pulse"></i>
</main><script>
const stage=document.querySelector('.stage'),popup=document.getElementById('popup'),cursor=document.getElementById('cursor'),pointer=document.getElementById('pointer'),pulse=document.getElementById('pulse'),actionMenu=document.getElementById('actionMenu'),operatorMenu=document.getElementById('operatorMenu'),actionText=document.getElementById('actionText'),operatorText=document.getElementById('operatorText'),quantityText=document.getElementById('quantityText'),targetAction=document.getElementById('targetAction'),targetOperator=document.getElementById('targetOperator'),periodOne=document.getElementById('periodOne'),periodTwo=document.getElementById('periodTwo'),periodThree=document.getElementById('periodThree'),periodFour=document.getElementById('periodFour'),periodOther=document.getElementById('periodOther'),otherText=document.getElementById('otherText'),apply=document.getElementById('apply'),clear=document.getElementById('clear'),periods=[periodOne,periodTwo,periodThree,periodFour,periodOther];
const duration=22000,clamp=n=>Math.max(0,Math.min(1,n)),ease=n=>n<.5?4*n*n*n:1-Math.pow(-2*n+2,3)/2,mix=(a,b,t)=>a+(b-a)*t;let cycle=-1,lastStep=-1;
const points={start:[820,470],action:[700,183],actionChoice:[500,271],operator:[299,271],operatorChoice:[299,347],quantity:[500,271],p1:[299,359],p2:[347,359],p3:[395,359],p4:[443,359],other:[590,359],apply:[330,430],clear:[416,430]};
function reset(){actionMenu.classList.remove('show');operatorMenu.classList.remove('show');targetAction.classList.remove('hover');targetOperator.classList.remove('hover');periods.forEach(p=>p.classList.remove('selected'));apply.classList.remove('pressed');clear.classList.remove('pressed');actionText.textContent='Действие покупателя';actionText.style.color='';operatorText.textContent='≥';quantityText.textContent='1';otherText.textContent='Другой период';popup.style.transform='translate(-50%,-50%)';popup.style.opacity=1}
function clickAt(p){pulse.style.left=p[0]+'px';pulse.style.top=p[1]+'px';pulse.classList.remove('hit');void pulse.offsetWidth;pulse.classList.add('hit')}
function move(t,a,b,p1,p2){const q=ease(clamp((t-a)/(b-a)));return[mix(p1[0],p2[0],q),mix(p1[1],p2[1],q)]}
function selectPeriod(active){periods.forEach(p=>p.classList.toggle('selected',p===active))}
function animate(now){const c=Math.floor(now/duration),t=now%duration;if(c!==cycle){reset();cycle=c;lastStep=-1}apply.classList.remove('pressed');clear.classList.remove('pressed');let pos=points.start,hand=false,step=0;
if(t<1000){pos=points.start}else if(t<1900){pos=move(t,1000,1900,points.start,points.action);hand=true;step=1}else if(t<2500){pos=points.action;hand=true;actionMenu.classList.add('show');step=2}else if(t<3300){pos=move(t,2500,3300,points.action,points.actionChoice);hand=true;actionMenu.classList.add('show');targetAction.classList.add('hover');step=3}else if(t<4000){pos=points.actionChoice;hand=true;actionText.textContent='Добавили в корзину';actionText.style.color='var(--ink)';actionMenu.classList.remove('show');step=4}else if(t<4800){pos=move(t,4000,4800,points.actionChoice,points.operator);hand=true;step=5}else if(t<5400){pos=points.operator;hand=true;operatorMenu.classList.add('show');step=6}else if(t<6100){pos=points.operatorChoice;hand=true;operatorMenu.classList.add('show');targetOperator.classList.add('hover');step=7}else if(t<6900){pos=move(t,6100,6900,points.operatorChoice,points.quantity);hand=true;operatorMenu.classList.remove('show');step=8}else if(t<7600){pos=points.quantity;hand=true;quantityText.textContent='3';step=9}else if(t<8400){pos=move(t,7600,8400,points.quantity,points.p1);hand=true;step=10}else if(t<9100){pos=points.p1;hand=true;selectPeriod(periodOne);step=11}else if(t<9900){pos=move(t,9100,9900,points.p1,points.p2);hand=true;selectPeriod(periodOne);step=12}else if(t<10600){pos=points.p2;hand=true;selectPeriod(periodTwo);step=13}else if(t<11400){pos=move(t,10600,11400,points.p2,points.p3);hand=true;selectPeriod(periodTwo);step=14}else if(t<12100){pos=points.p3;hand=true;selectPeriod(periodThree);step=15}else if(t<12900){pos=move(t,12100,12900,points.p3,points.p4);hand=true;selectPeriod(periodThree);step=16}else if(t<13600){pos=points.p4;hand=true;selectPeriod(periodFour);step=17}else if(t<14600){pos=move(t,13600,14600,points.p4,points.other);hand=true;selectPeriod(periodFour);step=18}else if(t<15500){pos=points.other;hand=true;selectPeriod(periodOther);otherText.textContent='7 дней';step=19}else if(t<16500){pos=move(t,15500,16500,points.other,points.apply);hand=true;selectPeriod(periodOther);otherText.textContent='7 дней';step=20}else if(t<17300){pos=points.apply;hand=true;selectPeriod(periodOther);otherText.textContent='7 дней';apply.classList.add('pressed');step=21}else if(t<18300){pos=move(t,17300,18300,points.apply,points.clear);hand=true;step=22}else if(t<19100){pos=points.clear;hand=true;clear.classList.add('pressed');step=23}else if(t<20700){pos=points.clear;hand=true;reset();step=24}else{pos=move(t,20700,22000,points.clear,points.start);step=25}
if(step!==lastStep&&[2,4,6,8,9,11,13,15,17,19,21,23].includes(step))clickAt(pos);lastStep=step;cursor.style.opacity=hand?0:1;pointer.style.opacity=hand?1:0;const cursorPos=`translate(${pos[0]-8}px,${pos[1]-4}px)`;cursor.style.transform=pointer.style.transform=cursorPos;requestAnimationFrame(animate)}
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1000,innerHeight/563)})`}addEventListener('resize',fit);fit();requestAnimationFrame(animate);
</script></body></html>
