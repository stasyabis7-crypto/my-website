<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Список покупателей</title>
<style>
:root{--blue:#005bff;--ink:rgba(0,17,34,.95);--secondary:rgba(0,17,34,.66);--muted:rgba(0,17,34,.56);--field:rgba(97,131,162,.1);--line:rgba(97,131,162,.2);--focus:#2f9bf9;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--blue);font-family:Inter,Arial,sans-serif;color:var(--ink)}
.stage{position:absolute;left:50%;top:50%;width:1000px;height:563px;transform:translate(-50%,-50%);transform-origin:center;background:var(--blue);overflow:hidden}
.popup{position:absolute;left:50%;top:50%;width:467px;height:353px;padding:24px 12px 8px;border-radius:8px;background:#fff;box-shadow:0 8px 16px -2px rgba(0,0,0,.12),0 0 2px rgba(0,0,0,.12);transform:translate(-50%,-50%) scale(1.15);transition:transform .42s var(--ease),opacity .3s}
.stage.calendar-open .popup{transform:translate(calc(-50% - 171px),-50%) scale(1.15)}
h1{margin:0 0 12px;font-size:15px;line-height:20px;font-weight:600}
.field{height:44px;border-radius:8px;background:var(--field);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:15px;line-height:20px;position:relative;transition:background .2s,box-shadow .2s}
.field strong{color:var(--ink);font-weight:400}
.field.open{background:#fff;box-shadow:inset 0 0 0 2px var(--focus)}
.field.open .chevron{transform:rotate(180deg)}
.chevron{display:block;width:24px;height:24px;margin-left:auto;transition:transform .22s var(--ease)}
.label{margin:20px 2px 4px;color:var(--secondary);font-size:15px;line-height:20px}
.qty-group,.period-group{display:grid;grid-template-rows:1fr;transition:grid-template-rows .36s var(--ease)}
.qty-group-inner,.period-group-inner{overflow:hidden;min-height:0;transition:opacity .22s}
.stage.action-open .qty-group,.stage.action-open .period-group{grid-template-rows:0fr}
.stage.action-open .qty-group-inner,.stage.action-open .period-group-inner{opacity:0}
.amount{display:grid;grid-template-columns:64px 1fr;gap:4px}
.operator{border-radius:8px 0 0 8px}
.quantity{height:44px;border-radius:0 8px 8px 0;background:var(--field);padding:4px 10px;transition:background .2s}.quantity small{display:block;color:var(--secondary);font-size:13px;line-height:16px}.quantity span{display:block;font-size:15px;line-height:20px}
.quantity.open{background:#dbe8ff}
.period-label{margin-top:20px}.periods{display:grid;grid-template-columns:40px 40px 40px 40px 1fr;gap:8px}
.period{height:44px;border-radius:8px;background:var(--field);display:grid;place-items:center;color:var(--secondary);font-size:15px;transition:.24s var(--ease)}
.period.selected{box-shadow:inset 0 0 0 2px var(--focus)}
.other{display:flex;align-items:center;padding:0 10px;white-space:nowrap;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px}
.other .row{display:flex;align-items:center;width:100%}
.other small{font-size:13px;line-height:16px;color:var(--secondary)}
.other span{font-size:15px;line-height:20px;color:var(--ink)}
.calendar-icon{display:block;width:24px;height:24px;margin-left:auto;flex:none}
.divider{height:1px;background:var(--line);margin-top:20px}
.actions{display:flex;gap:8px;padding-top:12px}
.button{height:32px;padding:0 14px;border:0;border-radius:6px;font:600 15px Inter,Arial;color:#fff;background:var(--blue);transition:transform .2s var(--ease),filter .2s}
.button.secondary{background:var(--field);color:var(--blue)}
.button.pressed{transform:scale(.95);filter:brightness(.92)}
.menu{position:absolute;z-index:5;left:12px;right:12px;top:108px;padding:6px;border-radius:8px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.3s var(--ease)}
.menu.show{opacity:1;transform:none}
.option{height:38px;padding:0 10px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.option .check{display:block;width:20px;height:20px;opacity:0;transition:opacity .18s}
.option.hover .check{opacity:1}
.op-menu{position:absolute;z-index:6;left:12px;top:190px;width:80px;padding:4px;border-radius:8px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(-4px);pointer-events:none;transition:.26s var(--ease)}
.op-menu.show{opacity:1;transform:none}
.op-option{height:32px;padding:0 10px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.op-option .check{display:block;width:16px;height:16px;opacity:0;transition:opacity .18s}
.op-option.active .check{opacity:1}
.calendar-pop{position:absolute;left:50%;top:50%;width:280px;padding:16px;border-radius:8px;background:#fff;box-shadow:0 8px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.12);opacity:0;pointer-events:none;transform:translate(calc(-50% + 279px),-50%) scale(1.104);transition:.4s var(--ease)}
.stage.calendar-open .calendar-pop{opacity:1;transform:translate(calc(-50% + 279px),-50%) scale(1.15)}
.cal-head{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;padding-bottom:8px;font-size:15px;line-height:20px;font-weight:600}
.cal-month{color:var(--ink)}.cal-year{color:var(--muted)}
.cal-nav{position:absolute;top:-4px;width:24px;height:24px}
.cal-nav.prev{left:-4px}.cal-nav.next{right:-4px}
.cal-nav:before{content:"";display:block;width:8px;height:8px;margin:8px;border-top:2px solid var(--secondary);border-right:2px solid var(--secondary)}
.cal-nav.prev:before{transform:rotate(-135deg)}.cal-nav.next:before{transform:rotate(45deg)}
.cal-weekdays{display:flex;gap:4px}.cal-weekdays span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:16px;color:var(--secondary)}
.cal-grid{position:relative;display:flex;flex-wrap:wrap;gap:4px;width:248px;margin-top:4px}
.cal-day{position:relative;z-index:2;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:16px;color:var(--ink);transition:background .2s var(--ease),color .2s}
.cal-day.empty{opacity:.5;pointer-events:none}
.cal-day.weekend{color:#d3003d}
.cal-day.disabled{opacity:.5;color:var(--muted);text-decoration:line-through}
.cal-day.disabled.weekend{color:#f96186}
.cal-day.today:after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:16px;height:2px;border-radius:8px;background:var(--focus)}
.cal-day.hover:not(.disabled):not(.empty){background:var(--field)}
.cal-day.on-endpoint{color:#fff}
.cal-fill{position:absolute;left:88px;top:116px;width:140px;height:32px;border-radius:6px;background:var(--field);opacity:0;transition:opacity .22s;z-index:1}
.cal-fill.show{opacity:1}
.cal-endpoint{position:absolute;width:34px;height:32px;opacity:0;transition:opacity .18s;z-index:1;pointer-events:none}
.cal-endpoint.show{opacity:1}
#calEnd1{left:87px;top:116px}
#calEnd2{left:195px;top:116px}
.cursor{position:absolute;z-index:20;left:0;top:0;width:24px;height:24px;pointer-events:none;transform-origin:4px 3px;will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){.cursor{display:none}.popup,.calendar-pop,.menu,.op-menu,.period,.button,.field,.cal-day,.qty-group,.period-group{transition:none}}
</style></head><body><main class="stage" id="stage">
<section class="popup" id="popup"><h1>Что сделали покупатели с вашими товарами</h1>
<div class="field" id="actionField"><span id="actionText">Действие покупателя</span><img class="chevron" src="assets/ic_m_chevron_down.svg" alt=""></div>
<div class="menu" id="actionMenu">
 <div class="option" id="targetAction"><span>Купили</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="option"><span>Посмотрели</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="option"><span>Добавили в корзину</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="option"><span>Добавили в избранное</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
</div>
<div class="qty-group"><div class="qty-group-inner">
<p class="label">Сколько товаров</p><div class="amount"><div class="field operator" id="operatorField"><strong id="operatorText">≥</strong><img class="chevron" src="assets/ic_m_chevron_down.svg" alt=""></div><div class="quantity" id="quantityField"><small>Количество товаров</small><span id="quantityText">1</span></div></div>
</div></div>
<div class="op-menu" id="operatorMenu">
 <div class="op-option" id="opGte"><span>≥</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="op-option" id="targetOperator"><span>=</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="op-option"><span>&gt;</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="op-option"><span>&lt;</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
 <div class="op-option"><span>≤</span><img class="check" src="assets/ic_m_check.svg" alt=""></div>
</div>
<div class="period-group"><div class="period-group-inner">
<p class="label period-label">За какой период, дней</p><div class="periods"><div class="period" id="periodOne">1</div><div class="period" id="periodTwo">2</div><div class="period" id="periodThree">3</div><div class="period" id="periodFour">4</div><div class="period other" id="periodOther"><div class="row"><small id="otherLabel">Другой период</small></div><div class="row"><span id="otherText">дд.мм.гггг</span><img class="calendar-icon" src="assets/ic_m_calendar_filled.svg" alt=""></div></div></div>
</div></div>
<div class="divider"></div><div class="actions"><button class="button" id="apply">Применить</button><button class="button secondary" id="clear">Очистить</button></div></section>
<section class="calendar-pop" id="calendarPop">
 <div class="cal-head"><i class="cal-nav prev"></i><span class="cal-month">Январь</span><span class="cal-year">2023</span><i class="cal-nav next"></i></div>
 <div class="cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
 <div class="cal-grid" id="calGrid"></div>
 <div class="cal-fill" id="calFill"></div>
 <img class="cal-endpoint" id="calEnd1" src="assets/select-1.svg" alt="">
 <img class="cal-endpoint" id="calEnd2" src="assets/select-2.svg" alt="">
</section>
<img class="cursor" id="cursorDefault" src="assets/cursor-default.svg" alt=""><img class="cursor" id="cursorPointer" src="assets/cursor-pointer.svg" alt="">
</main><script>
const stage=document.getElementById('stage'),popup=document.getElementById('popup'),normal=document.getElementById('cursorDefault'),pointer=document.getElementById('cursorPointer');
const actionField=document.getElementById('actionField'),actionMenu=document.getElementById('actionMenu'),actionText=document.getElementById('actionText'),targetAction=document.getElementById('targetAction');
const operatorField=document.getElementById('operatorField'),operatorMenu=document.getElementById('operatorMenu'),operatorText=document.getElementById('operatorText'),targetOperator=document.getElementById('targetOperator'),opGte=document.getElementById('opGte');
const quantityField=document.getElementById('quantityField'),quantityText=document.getElementById('quantityText');
const periodOne=document.getElementById('periodOne'),periodTwo=document.getElementById('periodTwo'),periodThree=document.getElementById('periodThree'),periodFour=document.getElementById('periodFour'),periodOther=document.getElementById('periodOther'),otherLabel=document.getElementById('otherLabel'),otherText=document.getElementById('otherText');
const periods=[periodOne,periodTwo,periodThree,periodFour,periodOther];
const apply=document.getElementById('apply'),clear=document.getElementById('clear');
const calendarPop=document.getElementById('calendarPop'),calGrid=document.getElementById('calGrid'),calFill=document.getElementById('calFill'),calEnd1=document.getElementById('calEnd1'),calEnd2=document.getElementById('calEnd2');

// Build January 2023 grid: Mon-start week, Jan 1 2023 = Sunday.
const WEEKEND=new Set([1,7,8,14,15,21,22,28,29]);
const DISABLED_FROM=11; // only 1..10 are selectable ("today" = 10)
const TODAY=10;
const cells=[];
for(let i=0;i<6;i++)cells.push(document.createElement('span')); // leading empties (Mon-Sat before Jan 1)
for(let d=1;d<=31;d++)cells.push(d);
while(cells.length<42)cells.push(document.createElement('span'));
const dayEls={};
cells.forEach(c=>{
 const el=document.createElement('span');el.className='cal-day';
 if(typeof c==='number'){
  el.textContent=c;el.dataset.day=c;
  if(WEEKEND.has(c))el.classList.add('weekend');
  if(c>=DISABLED_FROM)el.classList.add('disabled');
  if(c===TODAY)el.classList.add('today');
  dayEls[c]=el;
 }else{el.classList.add('empty')}
 calGrid.appendChild(el);
});

const duration=21600,clamp=n=>Math.max(0,Math.min(1,n));
// Cursor travel eases out (fast start, gentle arrival) — reads calmer/more
// deliberate than a symmetric in-out curve, closer to a real, confident hand.
const ease=n=>1-Math.pow(1-n,3);
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
let cycle=-1;
// Popup/calendar are shown at 1.15x (see .popup/.calendar-pop transforms) so
// the UI reads clearly at gallery-card size. Every point below is the
// stage-space position AFTER that zoom (and after the popup's -171px open
// shift / calendar's +279px offset), pre-computed so the cursor lands
// exactly on the zoomed targets instead of the pre-zoom layout.
const points={start:[820,470],action:[730,168.23],actionChoice:[500,225.72],operator:[268.85,269.43],operatorChoice:[268.85,356.82],quantity:[500,269.43],p1:[268.85,370.62],p2:[324.05,370.62],p3:[379.25,370.62],p4:[434.45,370.62],other:[603.5,370.62],otherShift:[629.15,370.62],day4:[737.6,256.2],day7:[861.8,256.2],apply:[304.5,452.27],clear:[403.4,452.27]};

function reset(){
 stage.classList.remove('calendar-open','action-open');
 actionMenu.classList.remove('show');operatorMenu.classList.remove('show');
 actionField.classList.remove('open');operatorField.classList.remove('open');quantityField.classList.remove('open');periodOther.classList.remove('open');
 targetAction.classList.remove('hover');targetOperator.classList.remove('hover');opGte.classList.add('active');targetOperator.classList.remove('active');
 periods.forEach(p=>p.classList.remove('selected'));
 apply.classList.remove('pressed');clear.classList.remove('pressed');
 Object.values(dayEls).forEach(el=>el.classList.remove('on-endpoint','hover'));
 calFill.classList.remove('show');calEnd1.classList.remove('show');calEnd2.classList.remove('show');
 actionText.textContent='Действие покупателя';actionText.style.color='';
 operatorText.textContent='≥';quantityText.textContent='1';
 otherLabel.textContent='Другой период';otherText.textContent='дд.мм.гггг';otherText.style.color='';
 popup.style.opacity=1;
}
function press(t,a){return 1-.14*Math.sin(clamp((t-a)/260)*Math.PI)}
function move(t,a,b,p1,p2){const q=ease(clamp((t-a)/(b-a)));return mix(p1,p2,q)}
function selectPeriod(active){periods.forEach(p=>p.classList.toggle('selected',p===active))}
function place(el,p,s){el.style.transform=`translate(${p[0]-8}px,${p[1]-4}px) scale(${s})`}

function animate(now){
 const c=Math.floor(now/duration),t=now%duration;
 if(c!==cycle){reset();cycle=c}
 let pos=points.start,hand=false,s=1;

 if(t<1100){pos=points.start}
 else if(t<2100){pos=move(t,1100,2100,points.start,points.action);hand=true}
 else if(t<2750){pos=points.action;hand=true;actionField.classList.add('open');if(t>=2350&&t<2610){s=press(t,2400)}if(t>=2400){actionMenu.classList.add('show');stage.classList.add('action-open')}}
 else if(t<3700){pos=move(t,2750,3700,points.action,points.actionChoice);hand=true;actionMenu.classList.add('show');actionField.classList.add('open');targetAction.classList.add('hover')}
 else if(t<4450){pos=points.actionChoice;hand=true;actionMenu.classList.add('show');actionField.classList.add('open');targetAction.classList.add('hover');if(t>=4050&&t<4310){s=press(t,4100)}if(t>=4100){actionText.textContent='Купили';actionText.style.color='var(--ink)';actionMenu.classList.remove('show');actionField.classList.remove('open');targetAction.classList.remove('hover');stage.classList.remove('action-open')}}
 else if(t<5450){pos=move(t,4450,5450,points.actionChoice,points.operator);hand=true}
 else if(t<6100){pos=points.operator;hand=true;operatorField.classList.add('open');if(t>=5750&&t<6010){s=press(t,5800)}if(t>=5800)operatorMenu.classList.add('show')}
 else if(t<7000){pos=move(t,6100,7000,points.operator,points.operatorChoice);hand=true;operatorMenu.classList.add('show');operatorField.classList.add('open');targetOperator.classList.add('hover');opGte.classList.remove('active')}
 else if(t<7700){pos=points.operatorChoice;hand=true;operatorMenu.classList.add('show');operatorField.classList.add('open');targetOperator.classList.add('hover');opGte.classList.remove('active');if(t>=7300&&t<7560){s=press(t,7350)}if(t>=7350){operatorText.textContent='=';operatorMenu.classList.remove('show');operatorField.classList.remove('open');targetOperator.classList.remove('hover');targetOperator.classList.add('active')}}
 else if(t<8600){pos=move(t,7700,8600,points.operatorChoice,points.quantity);hand=true}
 else if(t<9350){pos=points.quantity;hand=true;quantityField.classList.add('open');if(t>=8950&&t<9210){s=press(t,9000)}if(t>=9000)quantityText.textContent='3'}
 else if(t<10300){pos=move(t,9350,10300,points.quantity,points.p1);hand=true;quantityField.classList.remove('open')}
 else if(t<10950){pos=points.p1;hand=true;if(t>=10550&&t<10810){s=press(t,10600)}if(t>=10600)selectPeriod(periodOne)}
 else if(t<11750){pos=move(t,10950,11750,points.p1,points.other);hand=true;selectPeriod(periodOne)}
 else if(t<12450){pos=points.other;hand=true;selectPeriod(periodOne);if(t>=12000&&t<12260){s=press(t,12050)}if(t>=12050){selectPeriod(null);stage.classList.add('calendar-open');periodOther.classList.add('open')}}
 else if(t<12800){pos=points.otherShift;hand=true;periodOther.classList.add('open')}
 else if(t<13700){pos=move(t,12800,13700,points.otherShift,points.day4);hand=true;periodOther.classList.add('open');dayEls[4].classList.add('hover')}
 else if(t<14400){pos=points.day4;hand=true;periodOther.classList.add('open');dayEls[4].classList.add('hover');if(t>=14000&&t<14260){s=press(t,14050)}if(t>=14050){dayEls[4].classList.remove('hover');dayEls[4].classList.add('on-endpoint');calEnd1.classList.add('show')}}
 else if(t<15100){pos=move(t,14400,15100,points.day4,points.day7);hand=true;periodOther.classList.add('open');dayEls[7].classList.add('hover')}
 else if(t<15800){pos=points.day7;hand=true;periodOther.classList.add('open');dayEls[7].classList.add('hover');if(t>=15400&&t<15660){s=press(t,15450)}if(t>=15450){dayEls[7].classList.remove('hover');dayEls[7].classList.add('on-endpoint');calEnd2.classList.add('show');calFill.classList.add('show');otherLabel.textContent='Другой период';otherText.textContent='04.01.2023 – 07.01.2023';otherText.style.color='var(--ink)'}}
 else if(t<16700){pos=move(t,15800,16700,points.day7,points.other);hand=true;if(t>=15850){stage.classList.remove('calendar-open');periodOther.classList.remove('open')}}
 else if(t<17450){pos=points.other;hand=true}
 else if(t<18350){pos=move(t,17450,18350,points.other,points.clear);hand=true}
 else if(t<19050){pos=points.clear;hand=true;if(t>=18650&&t<18910){s=press(t,18700);clear.classList.add('pressed')}if(t>=18700){clear.classList.remove('pressed');reset()}}
 else if(t<20250){pos=points.clear}
 else{pos=move(t,20250,21350,points.clear,points.start);hand=false}

 normal.style.opacity=hand?0:1;pointer.style.opacity=hand?1:0;
 place(normal,pos,s);place(pointer,pos,s);
 requestAnimationFrame(animate);
}
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1000,innerHeight/563)})`}
addEventListener('resize',fit);fit();requestAnimationFrame(animate);
</script></body></html>
