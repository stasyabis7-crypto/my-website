<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Знак добра — мобильная шторка</title>
<style>
@font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"CoFo Avito Text";src:url("assets/fonts/CoFoAvitoText-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--canvas-width:1000;--canvas-height:800;--canvas-bg:#34c759;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--canvas-bg);font-family:"CoFo Avito Text",Arial,sans-serif}
body{display:grid;place-items:center}
.viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--canvas-bg)}
.canvas{position:absolute;left:50%;top:50%;width:1000px;height:800px;transform-origin:center;background:var(--canvas-bg)}
.phone{position:absolute;left:50%;top:50%;width:354px;height:720px;transform:translate(-50%,-50%) scale(1);transform-origin:50% 72%;border-radius:60px;background:linear-gradient(110deg,#777,#f6f4e9 18%,#777 42%,#e8e5d8 72%,#777);padding:6px;box-shadow:0 22px 42px rgba(30,33,36,.18);animation:phoneFocus 9s var(--ease) infinite}
.bezel{position:relative;width:100%;height:100%;padding:8px;border-radius:55px;background:#090909;overflow:hidden}
.display{position:relative;width:100%;height:100%;border-radius:47px;background:#fff;overflow:hidden}
.status{position:absolute;z-index:20;inset:0 0 auto;height:45px;background:#fff;color:#000;font-size:13px;font-weight:700}
.time{position:absolute;left:46px;top:17px}
.island{position:absolute;left:50%;top:9px;width:98px;height:29px;transform:translateX(-50%);border-radius:20px;background:#000}
.camera{position:absolute;right:11px;top:9px;width:8px;height:8px;border-radius:50%;background:#0b1324;box-shadow:inset 0 0 3px #3153a4}
.levels{position:absolute;right:0;top:18px;width:107px;height:10px;display:block}
.status-backdrop{position:absolute;z-index:25;left:0;right:0;top:0;height:45px;background:rgba(0,0,0,.4);opacity:0;animation:backdrop 9s var(--ease) infinite;pointer-events:none}
.screens{position:absolute;inset:45px 0 0;background:#fff;overflow:hidden}
.app-bg{position:absolute;left:0;top:-51px;width:100%;height:auto;display:block;background:#fff}
.backdrop{position:absolute;z-index:4;inset:0;background:rgba(0,0,0,.4);opacity:0;animation:backdrop 9s var(--ease) infinite}
.bottom-sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;height:auto;border-radius:24px 24px 0 0;background:#fff;overflow:hidden;transform:translateY(102%);animation:sheet 9s var(--ease) infinite;box-shadow:0 -8px 28px rgba(0,0,0,.08)}
.handle{position:absolute;z-index:3;left:50%;top:7px;width:34px;height:4px;border-radius:3px;background:rgba(0,0,0,.08);transform:translateX(-50%)}
.close{position:absolute;z-index:4;right:14px;top:13px;width:24px;height:24px;border:0;background:transparent;padding:0}
.close:before,.close:after{content:"";position:absolute;left:11px;top:2px;width:2px;height:20px;border-radius:2px;background:#111}
.close:before{transform:rotate(45deg)}.close:after{transform:rotate(-45deg)}
.touch{position:absolute;z-index:8;right:5px;top:5px;width:42px;height:42px;border:1px solid rgba(255,255,255,.92);border-radius:50%;background:rgba(255,255,255,.38);box-shadow:inset 0 0 13px rgba(255,255,255,.82),0 4px 14px rgba(0,0,0,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:scale(.8);animation:touchClose 9s var(--ease) infinite;pointer-events:none}
.hero{height:201px;background:linear-gradient(90deg,#e3f7ff 10%,#e2ffd6 90%);overflow:hidden}
.hero img{width:100%;height:100%;display:block;object-fit:cover}
.content{padding:14px 14px 0;background:#fff}
.title{margin:0 0 5px;font-size:21px;line-height:24px;font-weight:700;letter-spacing:-.2px}
.description{margin:0;font-size:13px;line-height:18px;font-weight:400;color:#111}
.description a{color:#757575;text-decoration:underline;text-underline-offset:2px}
.footer{position:relative;height:76px;margin-top:16px;padding:8px;background:#fff;box-shadow:0 -5px 18px rgba(0,0,0,.04)}
.primary{width:100%;height:44px;border:0;border-radius:14px;background:#141414;color:#fff;font:600 13px/18px "CoFo Avito Text",Arial,sans-serif}
.home{position:absolute;z-index:30;bottom:7px;left:50%;width:104px;height:4px;border-radius:4px;background:#000;transform:translateX(-50%)}
@keyframes backdrop{0%,8%,91%,100%{opacity:0}20%,82%{opacity:1}}
@keyframes sheet{0%,8%{transform:translateY(102%);opacity:.98}20%,82%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(102%);opacity:.98}}
@keyframes phoneFocus{0%,22%{top:50%;transform:translate(-50%,-50%) scale(1)}38%,56%{top:calc(50% - 81px);transform:translate(-50%,-50%) scale(1.4)}70%,100%{top:50%;transform:translate(-50%,-50%) scale(1)}}
@keyframes touchClose{0%,72%{opacity:0;transform:scale(.8)}76%{opacity:1;transform:scale(1)}79%{opacity:1;transform:scale(.72)}82%{opacity:0;transform:scale(1.08)}100%{opacity:0;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.phone{animation:none}.backdrop,.status-backdrop{animation:none;opacity:1}.bottom-sheet{animation:none;transform:none}.touch{animation:none}}
</style>
</head>
<body>
<main class="viewport">
 <div class="canvas">
  <div class="phone">
   <div class="bezel">
    <div class="display">
     <div class="status">
      <span class="time">9:41</span>
      <div class="island"><i class="camera"></i></div>
      <img class="levels" src="assets/levels.svg" alt="">
     </div>
     <div class="status-backdrop"></div>
     <div class="screens">
      <img class="app-bg" src="assets/mob.png" alt="">
      <div class="backdrop"></div>
      <section class="bottom-sheet" aria-label="Знак добра">
       <div class="handle"></div>
       <button class="close" type="button" aria-label="Закрыть"></button>
       <i class="touch" aria-hidden="true"></i>
       <div class="hero"><img src="assets/ill-ads-sheet.png" alt=""></div>
       <div class="content">
        <h1 class="title" data-i18n="title"></h1>
        <p class="description"><span data-i18n="description"></span> <a href="#" data-i18n="more"></a></p>
       </div>
       <div class="footer"><button class="primary" type="button" data-i18n="button"></button></div>
      </section>
     </div>
     <div class="home"></div>
    </div>
   </div>
  </div>
 </div>
</main>
<script>
{
 const copy={
  ru:{title:'«Знак добра» за пожертвование',description:'Добавьте значок в объявление: оно станет заметнее, и больше людей узнают, что добро дарить легко.',more:'Подробнее',button:'Помочь фонду'},
  en:{title:'A Kindness Badge for a donation',description:'Add the badge to your listing to make it more noticeable and show more people how easy it is to do good.',more:'Learn more',button:'Support the charity'}
 };
 const hangingWords={ru:['а','без','в','во','да','для','до','за','и','из','или','к','ко','либо','на','над','не','ни','но','о','об','от','по','под','при','про','с','со','у','через'],en:['a','an','and','as','at','by','for','from','in','of','on','or','the','to','with']};
 function removeHangingWords(value,language){const words=hangingWords[language].join('|');return value.replace(new RegExp('(^|[\\s(«„“])('+words+')\\s+(?=\\S)','giu'),(_,prefix,word)=>prefix+word+'\u00a0')}
 const params=new URLSearchParams(location.search);let lang=(params.get('lang')||document.documentElement.lang||'ru').toLowerCase().startsWith('en')?'en':'ru';
 function applyLanguage(next){lang=next==='en'?'en':'ru';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=removeHangingWords(copy[lang][node.dataset.i18n],lang))}
 window.phoneAnimationSetLanguage=applyLanguage;applyLanguage(lang);
 const canvas=document.querySelector('.canvas');
 function fit(){const viewport=document.querySelector('.viewport'),scale=Math.min(viewport.clientWidth/1000,viewport.clientHeight/800);canvas.style.transform=`translate(-50%,-50%) scale(${scale})`}
 addEventListener('resize',fit);fit();
}
</script>
</body>
</html>
