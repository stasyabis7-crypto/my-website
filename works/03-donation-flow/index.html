<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Пожертвование — HTML-анимация</title>
  <style>
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Medium.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-SemiBold.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Bold.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-ExtraBold.woff2") format("woff2");font-style:normal;font-weight:800;font-display:swap}
    @font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Black.woff2") format("woff2");font-style:normal;font-weight:900;font-display:swap}
    :root{color-scheme:light dark;--blue:#00aaff;--soft:#f2f1f0;--muted:#757575;--black:#111;--ease:cubic-bezier(.22,.61,.36,1)} 
    *{box-sizing:border-box}button,input,select,textarea{color:inherit}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"CoFo Avito Text",Arial,sans-serif;color:#000}
    body{display:grid;place-items:center}
    .viewport{position:relative;width:100vw;height:100vh;overflow:hidden;background:transparent}
    .canvas{position:absolute;inset:0;width:540px;height:1040px;transform-origin:0 0;background:transparent}
    .phone{position:absolute;left:50%;top:50%;width:460px;height:934px;transform:translate(-50%,-50%) scale(.95);border-radius:78px;background:linear-gradient(110deg,#777,#f6f4e9 18%,#777 42%,#e8e5d8 72%,#777);padding:7px;box-shadow:0 22px 42px rgba(30,33,36,.16)}
    .bezel{position:relative;width:100%;height:100%;padding:10px;border-radius:72px;background:#090909;overflow:hidden}
    .display{position:relative;width:100%;height:100%;border-radius:61px;background:#fff;overflow:hidden}
    .status{position:absolute;z-index:20;left:0;right:0;top:0;height:58px;background:#fff;color:#000;font-weight:700;font-size:16px}
    .time{position:absolute;left:59px;top:22px}.island{position:absolute;left:50%;top:12px;width:126px;height:37px;transform:translateX(-50%);border-radius:24px;background:#000}.camera{position:absolute;right:14px;top:11px;width:10px;height:10px;border-radius:50%;background:#0b1324;box-shadow:inset 0 0 3px #3153a4}
    .levels{position:absolute;right:0;top:24px;width:138px;height:13px;display:block}
    .screen{position:absolute;z-index:2;inset:58px 0 0;background:#fff;opacity:0;visibility:hidden;transition:opacity .72s var(--ease);display:flex;flex-direction:column}.screen.active{opacity:1;visibility:visible}
    .nav{height:58px;position:relative;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;font-weight:700}.back{position:absolute;left:6px;width:40px;height:40px;display:block}.close{position:absolute;left:19px;top:50%;width:24px;height:24px;display:block;transform:translateY(-50%)}
    .content{padding:12px 24px 0;flex:1}.title{font-size:28px;line-height:31px;margin:0 0 16px;font-weight:750;letter-spacing:-.5px}.segment{height:53px;background:var(--soft);padding:4px;border-radius:17px;display:flex;margin-bottom:25px}.segment span{flex:1;display:grid;place-items:center;font-size:16px;border-radius:13px}.segment .selected{background:#fff;box-shadow:0 4px 13px rgba(0,0,0,.1)}
    .label{font-size:17px;font-weight:700;margin:0 0 12px}.fund{height:108px;border-radius:21px;background:var(--soft);display:flex;align-items:flex-start;padding:14px 16px;gap:12px}.fund-logo{width:50px;height:50px;border-radius:13px;object-fit:cover}.fund-copy{min-width:0;flex:1}.fund-name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}.fund-desc{font-size:14px;line-height:17px}.fund-arrow{width:20px;height:20px;display:block;margin-top:0}.secondary{height:53px;border:0;border-radius:17px;background:var(--soft);width:100%;font-size:16px;margin:7px 0 25px}.amounts{display:flex;gap:7px;margin-bottom:7px}.chip{flex:1;height:53px;border:0;border-radius:17px;background:var(--soft);font-size:17px}.chip.selected{background:var(--blue);color:#fff}.custom{height:53px;border-radius:17px;background:var(--soft);display:flex;align-items:center;padding:0 18px;color:var(--muted);font-size:16px}.legal{font-size:13px;line-height:17px;color:var(--muted);margin-top:16px}.legal u{text-underline-offset:2px}
    .bottom{padding:10px 10px 44px;margin-top:auto;background:#fff}.primary{height:53px;width:100%;border:0;border-radius:17px;background:var(--blue);color:#fff;font-size:16px}.primary.dark{background:#111}.home{position:absolute;z-index:30;bottom:9px;left:50%;width:134px;height:5px;border-radius:4px;background:#000;transform:translateX(-50%)}
    .pay-content{padding:18px 24px 0}.sum{font-size:28px;font-weight:750;margin:0 0 26px}.method{height:70px;display:flex;align-items:center;gap:13px}.method img{width:52px;height:52px;border-radius:14px;object-fit:cover}.method-copy{flex:1}.method-name{font-size:16px;margin-bottom:3px}.method-sub{font-size:13px;color:var(--muted)}.radio{display:block;flex:none;width:24px;height:24px;border-radius:50%;background:#e6e6e6}.method img.selected-check{width:24px;height:24px;border-radius:50%;object-fit:contain;background:transparent}.payment-legal{margin-top:16px;font-size:13px;line-height:17px;color:var(--muted)}
    .success-content{text-align:center;padding:80px 24px 0;display:flex;flex-direction:column;align-items:center;flex:1}.success-visual{position:relative;width:196px;height:156px;margin-bottom:2px}.success-check{position:absolute;left:7px;top:0;width:178px;height:142px;display:block;object-fit:contain;filter:drop-shadow(0 7px 5px rgba(0,145,73,.14));opacity:0}.success-fund-logo{position:absolute;z-index:3;right:18px;bottom:14px;width:58px;height:58px;border-radius:50%;background:#fff;padding:7px;object-fit:cover;box-shadow:0 7px 22px rgba(0,0,0,.15);opacity:0}.screen.active .success-check{animation:check-pop 1.15s cubic-bezier(.22,.61,.36,1) .16s forwards}.screen.active .success-fund-logo{animation:logo-land 1s cubic-bezier(.22,.61,.36,1) .72s forwards}@keyframes check-pop{0%{opacity:0;transform:scale(.78) rotate(-4deg)}55%{opacity:.85;transform:scale(1.025) rotate(.6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes logo-land{0%{opacity:0;transform:translate(8px,-10px) scale(.82) rotate(4deg)}65%{opacity:.9;transform:translate(-1px,1px) scale(1.018) rotate(-.5deg)}100%{opacity:1;transform:none}}.success-title{font-size:24px;line-height:27px;font-weight:750;max-width:310px;margin:0 0 9px}.success-sub{font-size:16px;line-height:21px;max-width:320px}.share{margin-top:auto;margin-bottom:18px}.share-title{font-size:19px;font-weight:750;margin-bottom:3px}.share-sub{font-size:16px;line-height:21px;max-width:340px}.green-heart{display:inline-block;color:#19c759;font-size:.95em;line-height:1;font-family:Arial,sans-serif}.share-icons{display:flex;justify-content:center;gap:10px;margin-top:16px}.share-icon{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.share-icon img{display:block;width:24px;height:24px;object-fit:contain}.share-icon:first-child img{width:20px;height:20px}
    .tap{position:absolute;z-index:40;left:50%;bottom:58px;width:62px;height:62px;margin-left:-31px;border-radius:50%;opacity:0;border:1px solid rgba(255,255,255,.8);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78),rgba(255,255,255,.18) 58%,rgba(255,255,255,.08));box-shadow:0 9px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(10px);transition:opacity .22s,transform .18s}.tap.show{opacity:1}.tap.press{transform:scale(.76)}
    @media(prefers-reduced-motion:reduce){.screen,.tap{transition-duration:.01ms!important}.success-check,.success-fund-logo{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <script src="../shared/theme-sync.js" defer></script>
</head>
<body>
<main class="viewport"><div class="canvas"><div class="phone"><div class="bezel"><div class="display">
  <div class="status"><span class="time">9:41</span><div class="island"><i class="camera"></i></div><img class="levels" src="./levels.svg" alt=""></div>

  <section class="screen active" data-screen="0"><div class="nav"><img class="back" src="./left-content.svg" alt=""><span data-i18n="navFunds"></span></div><div class="content"><h1 class="title" data-i18n="chooseTitle"></h1><div class="segment"><span class="selected" data-i18n="once"></span><span data-i18n="monthly"></span></div><p class="label" data-i18n="fundLabel"></p><div class="fund"><img class="fund-logo" src="./fund-logo.png" alt=""><div class="fund-copy"><div class="fund-name" data-i18n="fundName"></div><div class="fund-desc" data-i18n="fundDesc"></div></div><img class="fund-arrow" src="./arrow-right.svg" alt=""></div><button class="secondary" data-i18n="change"></button><p class="label" data-i18n="amountLabel"></p><div class="amounts"><button class="chip selected">100 ₽</button><button class="chip">300 ₽</button><button class="chip">500 ₽</button></div><div class="custom" data-i18n="customAmount"></div><p class="legal" data-i18n-html="offerShort"></p></div><div class="bottom"><button class="primary" data-i18n="donate"></button></div></section>

  <section class="screen" data-screen="1"><div class="nav"><img class="back" src="./left-content.svg" alt=""><span data-i18n="paymentTitle"></span></div><div class="pay-content"><h1 class="sum">100 ₽</h1><div class="method"><img src="./sbp.png" alt=""><div class="method-copy"><div class="method-name" data-i18n="sbp"></div><div class="method-sub" data-i18n="sbpSub"></div></div><img class="radio selected-check" src="./checkmark.svg" alt=""></div><div class="method"><img src="./sberpay.png" alt=""><div class="method-copy"><div class="method-name">SberPay</div><div class="method-sub" data-i18n="sberSub"></div></div><i class="radio"></i></div><div class="method"><img src="./tpay.png" alt=""><div class="method-copy"><div class="method-name">Т‑Pay</div><div class="method-sub" data-i18n="tpaySub"></div></div><i class="radio"></i></div><div class="method"><img src="./new-card.png" alt=""><div class="method-copy"><div class="method-name" data-i18n="newCard"></div><div class="method-sub">Visa, Mastercard, МИР</div></div><i class="radio"></i></div><p class="payment-legal" data-i18n-html="offerLong"></p></div><div class="bottom"><button class="primary dark" data-i18n="pay"></button></div></section>

  <section class="screen" data-screen="2"><div class="nav"><img class="close" src="./Close.svg" alt="Закрыть"><span data-i18n="thanks"></span></div><div class="success-content"><div class="success-visual" aria-hidden="true"><img class="success-check" src="./success-check.png" alt=""><img class="success-fund-logo" src="./fund-logo.png" alt=""></div><h1 class="success-title" data-i18n="successTitle"></h1><div class="success-sub" data-i18n="successSub"></div><div class="share"><div class="share-title" data-i18n="shareTitle"></div><div class="share-sub"><span data-i18n="shareSub"></span> <span class="green-heart" aria-label="love">♥</span></div><div class="share-icons"><span class="share-icon"><img src="./link.svg" alt=""></span><span class="share-icon"><img src="./telegram.svg" alt=""></span><span class="share-icon"><img src="./vk.svg" alt=""></span></div></div></div><div class="bottom"><button class="primary dark" data-i18n="addBadge"></button></div></section>
  <div class="tap" aria-hidden="true"></div><div class="home"></div>
</div></div></div></div></main>
<script>
{
  const copy={ru:{navFunds:'Помощь фондам',chooseTitle:'Выберите фонд и сумму пожертвования',once:'Разово',monthly:'Ежемесячно',fundLabel:'Выбор фонда',fundName:'Российский Красный Крест',fundDesc:'Гуманитарная помощь пострадавшим в чрезвычайных ситуациях',change:'Изменить',amountLabel:'Сумма пожертвования',customAmount:'Своя сумма',offerShort:'Нажимая кнопку, вы принимаете <u>условия оферты</u>',donate:'Сделать пожертвование',paymentTitle:'Выбор способа оплаты',sbp:'СБП',sbpSub:'Оплата в приложении вашего банка',sberSub:'Понадобится приложение СберБанк',tpaySub:'Понадобится приложение Т‑Банк',newCard:'Новая карта',offerLong:'Нажимая кнопку, вы соглашаетесь с <u>офертой фонда</u> — у вас откроется его страница для внесения пожертвования.',pay:'Перейти к оплате 100 ₽',thanks:'Спасибо за помощь',successTitle:'Отправили 100 ₽ в фонд «Российский Красный Крест»',successSub:'Благодаря вам люди получают помощь в экстренных ситуациях',shareTitle:'Помогать вместе — приятнее',shareSub:'Поделитесь ссылкой с близкими. Пусть добрых дел станет больше',addBadge:'Добавить значок на объявление'},en:{navFunds:'Help charities',chooseTitle:'Choose a charity and donation amount',once:'One‑time',monthly:'Monthly',fundLabel:'Charity',fundName:'Russian Red Cross',fundDesc:'Humanitarian aid for people affected by emergencies',change:'Change',amountLabel:'Donation amount',customAmount:'Custom amount',offerShort:'By tapping the button, you accept the <u>offer terms</u>',donate:'Donate',paymentTitle:'Choose payment method',sbp:'Fast Payment System',sbpSub:'Pay in your banking app',sberSub:'Requires the SberBank app',tpaySub:'Requires the Т‑Bank app',newCard:'New card',offerLong:'By tapping the button, you accept the <u>charity offer</u> and will open its payment page.',pay:'Proceed to pay ₽100',thanks:'Thank you for helping',successTitle:'Sent ₽100 to the Russian Red Cross',successSub:'Thanks to you, people receive help in emergencies',shareTitle:'Helping together feels better',shareSub:'Share the link with friends and help good deeds grow',addBadge:'Add the badge to your listing'}};
  const params=new URLSearchParams(location.search);let lang=params.get('lang')||document.documentElement.lang||'ru';try{lang=params.get('lang')||parent.document.documentElement.lang||lang}catch{}lang=lang.toLowerCase().startsWith('en')?'en':'ru';
  const hangingWords={
    ru:['а','без','в','во','да','для','до','за','и','из','или','к','ко','либо','на','над','не','ни','но','о','об','от','по','под','при','про','с','со','у','через'],
    en:['a','an','and','as','at','by','for','from','in','of','on','or','the','to','with']
  };
  function removeHangingWords(value,language){
    const words=hangingWords[language].join('|');
    const pattern=new RegExp('(^|[\\s(«‘“])('+words+')\\s+(?=\\S)','giu');
    return value
      .replace(pattern,(_,prefix,word)=>prefix+word+'⁠ ⁠')
      .replace(/\s+—\s+/g,' — ');
  }
  function applyLanguage(next){
    lang=next==='en'?'en':'ru';
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i18n]').forEach(n=>{
      n.textContent=removeHangingWords(copy[lang][n.dataset.i18n],lang);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(n=>{
      n.innerHTML=removeHangingWords(copy[lang][n.dataset.i18nHtml],lang);
    });
  }
  window.paymentFlowSetLanguage=applyLanguage;
  applyLanguage(lang);
  const canvas=document.querySelector('.canvas'),screens=[...document.querySelectorAll('.screen')],tap=document.querySelector('.tap');let generation=0;
  function fit(){const v=document.querySelector('.viewport');canvas.style.transform=`scale(${Math.min(v.clientWidth/540,v.clientHeight/1040)})`}addEventListener('resize',fit);fit();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));function show(i){screens.forEach((s,n)=>s.classList.toggle('active',n===i))}async function press(){tap.classList.add('show');await wait(320);tap.classList.add('press');await wait(180);tap.classList.remove('press');await wait(190);tap.classList.remove('show');await wait(220)}
  async function loop(){const id=++generation;while(id===generation){show(0);await wait(2700);if(id!==generation)return;await press();show(1);await wait(2700);if(id!==generation)return;await press();show(2);await wait(3400);if(id!==generation)return;show(0);await wait(800)}}loop();
}
</script>
</body></html>
