<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Внутреннее волонтерство</title>
<style>:root{color-scheme:normal;--stage-bg:#f0f1f4}
[data-embed-theme="dark"]{--stage-bg:#262a33}
body,.stage{transition:background-color .3s ease}
@font-face{font-family:CoFo;src:url("../fonts/CoFoAvitoText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:CoFo;src:url("../fonts/CoFoAvitoText-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:CoFo;src:url("../fonts/CoFoAvitoText-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;background:var(--stage-bg);font-family:CoFo,Arial,sans-serif;color:#000}
.stage{position:relative;width:min(100vw,calc(100vh * 2));aspect-ratio:2/1;overflow:hidden;background:var(--stage-bg)}
.device{position:absolute;left:50%;top:34px;width:840px;height:660px;transform:translateX(-50%);filter:drop-shadow(0 20px 18px rgba(27,52,20,.24))}
.device-frame{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.device-screen{position:absolute;left:1.4894%;right:1.4894%;top:2.3411%;bottom:2.3411%;overflow:hidden;border-radius:2.4123%/3.8596%;background:#fff}
.page{position:absolute;left:0;top:0;width:1440px;height:881px;transform-origin:0 0;background:#fff;color:#000}
.hero{height:616px}
.hero img{display:block;width:1440px;height:616px;border-radius:0;object-fit:cover}
.metrics{height:106px;margin:48px 76px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;transition:opacity .18s linear}
.metric{min-width:0}
.metric-value{height:54px;font-size:60px;line-height:54px;font-weight:800;letter-spacing:-1.8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.metric-label{max-width:260px;margin-top:12px;font-size:15px;line-height:20px;font-weight:500}
@media (prefers-reduced-motion:reduce){.metrics{transition:none}}
</style>
  <script src="../shared/raf-gate.js"></script><script src="../shared/theme-sync.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="device" aria-label="Десктопная версия страницы о корпоративном волонтёрстве">
    <svg class="device-frame" viewBox="0 0 940 598" preserveAspectRatio="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="937" height="595" rx="34" fill="#17181b" stroke="#66686d" stroke-width="3"/>
      <rect x="3.5" y="3.5" width="933" height="591" rx="32" fill="none" stroke="#9a9ca1" stroke-width="1"/>
    </svg>
    <div class="device-screen" id="screen">
      <div class="page" id="page">
        <div class="hero"><img src="assets/banner.webp" alt="Корпоративное волонтёрство"></div>
        <section class="metrics" id="metrics" aria-label="Результаты корпоративного волонтёрства">
          <article class="metric"><div class="metric-value" data-target="3700">0</div><div class="metric-label">активных волонтёров среди сотрудников</div></article>
          <article class="metric"><div class="metric-value" data-target="2.3" data-suffix=" т" data-decimals="1">0 т</div><div class="metric-label">вещей передали на благотворительность и переработку</div></article>
          <article class="metric"><div class="metric-value" data-target="126">0</div><div class="metric-label">благотворительных мероприятий, в которых приняли участие</div></article>
          <article class="metric"><div class="metric-value" data-target="16.1" data-suffix=" млн ₽" data-decimals="1">0 млн ₽</div><div class="metric-label">направили в помощь фондам</div></article>
        </section>
      </div>
    </div>
  </section>
</main>
<script>
const screen=document.getElementById('screen');
const page=document.getElementById('page');
const metrics=document.getElementById('metrics');
const values=[...document.querySelectorAll('.metric-value')];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){
  const scale=screen.clientWidth/1440;
  page.style.transform=`translateY(-18px) scale(${scale})`;
}

function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function clamp(value,min=0,max=1){return Math.min(max,Math.max(min,value))}
function formatValue(el,value){
  const decimals=Number(el.dataset.decimals||0);
  const suffix=el.dataset.suffix||'';
  const formatted=value.toLocaleString('ru-RU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  return `${formatted}${suffix}`;
}

const cycleDuration=8000;
const countDuration=1900;
const firstStart=1400;
const stagger=160;

function draw(now){
  const t=now%cycleDuration;
  metrics.style.opacity=t<600?t/600:t<6500?1:t<7200?1-(t-6500)/700:0;
  values.forEach((el,index)=>{
    const target=Number(el.dataset.target);
    const progress=reduceMotion?1:clamp((t-firstStart-index*stagger)/countDuration);
    const eased=easeOutCubic(progress);
    const decimals=Number(el.dataset.decimals||0);
    const factor=10**decimals;
    const current=Math.round(target*eased*factor)/factor;
    el.textContent=formatValue(el,current);
  });
  requestAnimationFrame(draw);
}

addEventListener('resize',resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
