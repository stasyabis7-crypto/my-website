<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ЯПомогаю — выбор благотворительного раздела</title>
<style>
  html,body{margin:0;padding:0;width:1000px;height:750px;overflow:hidden;background:#0994ed;}
  #anim{width:1000px;height:750px;}
</style>
</head>
<body>
<div id="anim"></div>
<script src="lottie.min.js"></script>
<script>
lottie.loadAnimation({
  container: document.getElementById('anim'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: 'menu-animation.json'
});
</script>
</body>
</html>
