<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Улучшения поповера</title>
<style>
*{box-sizing:border-box}:root{--stage-bg:#f0f1f4;--ink:rgba(0,17,34,.95);--secondary:rgba(0,17,34,.66);--muted:rgba(0,17,34,.56);--line:rgba(97,131,162,.2);--warning:#f7b200;--ease:cubic-bezier(.22,.61,.36,1)}[data-embed-theme="dark"]{--stage-bg:#262a33}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}body{font-family:Inter,Arial,sans-serif;color:var(--ink)}.stage{position:relative;width:1000px;height:1000px;overflow:hidden;background:var(--stage-bg);transition:background-color .3s ease}.scene{position:absolute;left:50%;top:50%;width:423px;height:510px;transform:translate(-50%,-50%) scale(1.12);transform-origin:center}.popover{position:absolute;left:22px;top:6px;width:379px;height:466px;padding:28px 32px 32px;border-radius:24px;background:#fff;box-shadow:0 16px 24px -2px rgba(0,0,0,.12),0 0 2px rgba(0,0,0,.12)}.close{position:absolute;right:20px;top:20px;width:24px;height:24px}.heading{margin:0;font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.3px}.caption{margin:0 0 16px;color:var(--secondary);font-size:15px;line-height:24px}.lines{display:flex;flex-direction:column;gap:12px}.line{height:24px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;line-height:24px}.line-label{display:flex;align-items:center;gap:4px;white-space:nowrap}.amount{white-space:nowrap}.warning{color:var(--warning)}.disabled{color:var(--muted)}.badge{height:24px;padding:2px 12px;border-radius:16px;background:rgba(97,131,162,.1);color:#546378;font-size:13px;line-height:20px;font-weight:600}.divider{height:1px;margin:0;background:var(--line)}.link{margin-top:16px;color:#005bff;font-size:15px;line-height:24px;font-weight:600}.target{position:relative;border-radius:5px;transition:background-color .28s ease}.target.hover{background:rgba(97,131,162,.1)}.tooltip{position:absolute;z-index:20;width:282px;padding:16px;border-radius:10px;background:#203148;color:rgba(255,255,255,.95);box-shadow:0 8px 18px rgba(0,0,0,.18);font-size:13px;line-height:18px;opacity:0;transform:translateY(6px) scale(.98);transform-origin:50% 0;transition:opacity .28s ease,transform .36s var(--ease),top .42s var(--ease)}.tooltip:before{content:"";position:absolute;left:50%;top:-6px;width:13px;height:13px;border-radius:2px;background:#203148;transform:translateX(-50%) rotate(45deg)}.tooltip.show{opacity:1;transform:none}.tooltip-title{margin-bottom:5px;font-weight:600}.tooltip-copy{color:rgba(255,255,255,.66)}.cursor{position:absolute;z-index:30;left:0;top:0;width:24px;height:24px;opacity:0;pointer-events:none;will-change:transform,opacity}@media(prefers-reduced-motion:reduce){.tooltip,.target{transition:none}}
.scene{transform:translate(-50%,-50%) scale(1.6)}
.target.hover{background:transparent}.popover{top:22px}
</style>
<script src="../shared/theme-sync.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="scene">
    <article class="popover">
      <img class="close" src="assets/ic_m_cross_compact.svg" alt="">
      <h1 class="heading">5 000–6 000 ₽</h1>
      <p class="caption">Мой склад</p>
      <div class="lines">
        <div class="line"><span class="line-label">Вознаграждение Ozon <span class="badge">11 %</span></span><span class="amount">6 390 ₽</span></div>
        <div class="line"><span class="line-label">Эквайринг</span><span class="amount">5 000 ₽</span></div>
        <div class="line"><span class="line-label">Обработка отправления</span><span class="amount warning">678 – 1 300 ₽</span></div>
        <div class="line"><span class="line-label">Логистика</span><span class="amount warning">300 ₽</span></div>
        <div class="line target" id="targetLastMile"><span class="line-label">Последняя миля</span><span class="amount warning">300 ₽</span></div>
        <div class="divider"></div>
        <div class="line"><span class="line-label">Возврат или отмена</span><span class="amount">300–465 ₽</span></div>
        <div class="line disabled"><span class="line-label">Обратная логистика</span><span class="amount">20 ₽</span></div>
        <div class="line disabled"><span class="line-label">Обработка возврата</span><span class="amount">300–465 ₽</span></div>
      </div>
      <div class="link">Как считаются расходы</div>
    </article>
    <aside class="tooltip" id="tooltip"><div class="tooltip-title" id="tooltipTitle"></div><div class="tooltip-copy" id="tooltipCopy"></div></aside>
    <img class="cursor" id="cursor" src="../30-customer-list/assets/cursor-default.svg" alt="">
  </section>
</main>
<script>
const cursor=document.getElementById('cursor'),tooltip=document.getElementById('tooltip'),tooltipTitle=document.getElementById('tooltipTitle'),tooltipCopy=document.getElementById('tooltipCopy'),targetLastMile=document.getElementById('targetLastMile');
const cursorDefault='../30-customer-list/assets/cursor-default.svg',cursorHelp='assets/cursor-help.svg';
const state={target:targetLastMile,x:334,y:258,top:295,title:'Последняя миля',copy:'Доставка заказа покупателю от ближайшего сортировочного центра.'};
const duration=7600,clamp=n=>Math.max(0,Math.min(1,n)),ease=n=>1-Math.pow(1-n,3),mix=(a,b,t)=>a+(b-a)*t,prog=(t,a,b)=>ease(clamp((t-a)/(b-a)));let cycle=-1,startTime=null,visible=false;
function setState(show){if(show===visible)return;state.target.classList.toggle('hover',show);tooltip.classList.toggle('show',show);cursor.src=show?cursorHelp:cursorDefault;visible=show;if(!show)return;tooltipTitle.textContent=state.title;tooltipCopy.textContent=state.copy;tooltip.style.left='70px';tooltip.style.top=`${state.top}px`}
function animate(now){if(startTime===null)startTime=now;const elapsed=now-startTime,c=Math.floor(elapsed/duration),t=elapsed%duration;if(c!==cycle){cycle=c;visible=true;setState(false)}let x=405,y=480,show=false;if(t>=1700&&t<2600){x=mix(405,state.x,prog(t,1700,2600));y=mix(480,state.y,prog(t,1700,2600))}else if(t>=2600&&t<5200){x=state.x;y=state.y;show=true}else if(t>=5200&&t<6100){x=mix(state.x,405,prog(t,5200,6100));y=mix(state.y,480,prog(t,5200,6100))}setState(show);cursor.style.opacity=1;cursor.style.transform=`translate(${x}px,${y}px)`;requestAnimationFrame(animate)}
requestAnimationFrame(animate);
</script>
</body>
</html>
