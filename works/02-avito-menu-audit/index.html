  <style>:root{color-scheme:light dark} 
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:transparent;
      font-family: Arial, Helvetica, sans-serif;
    }
    #viewport {
      position: relative;
      width: min(100vw, 1000px);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background:transparent;
    }
    #scene {
      position: absolute;
      left: 0;
      top: 0;
      width: 1000px;
      height: 750px;
      transform-origin: top left;
    }
    #composition {
      position: absolute;
      left: 50%;
      top: calc(50% - 42px);
      width: 1000px;
      height: 750px;
      transform: translate(-50%, -50%) scale(1.18);
      transform-origin: center;

    .header {

      left: 50%;
      top: 331px;

      white-space: nowrap;

      right: 17px;
      top: 17px;
      width: 13px;
      height: 8px;
      border-left: 1.8px solid #111;
      border-bottom: 1.8px solid #111;
      opacity: 0;
      transform: rotate(-45deg) scale(.75);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.8,.2,1);
    }
    .menu-row.selected .check { opacity: 1; transform: rotate(-45deg) scale(1); }
    .cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      pointer-events: none;

      transition: opacity 100ms linear;
      will-change: transform, opacity;
      z-index: 10;

  </main>
  <script>
    const translations = {
      ru: {
        navHelp: '#яПомогаю',
        navCharity: 'Благотворительность',
        navCrisis: 'Кризисная помощь',
        navEcology: 'Экология',
        kindnessTitle: 'Знак добра',
        kindnessSubtitle: 'Как получить и добавить в объявление',
        goodsTitle: 'Благотворительные товары',
        goodsSubtitle: 'Как приобрести вещи со смыслом',
        animalsTitle: 'Животные из приютов',
        animalsSubtitle: 'Подарите дом питомцу'
      },
      en: {
        navHelp: '#IHelp',
        navCharity: 'Charity',
        navCrisis: 'Crisis support',
        navEcology: 'Environment',
        kindnessTitle: 'Badge of kindness',
        kindnessSubtitle: 'How to get it and add it to your listing',
        goodsTitle: 'Charitable goods',
        goodsSubtitle: 'How to shop with purpose',
        animalsTitle: 'Shelter animals',
        animalsSubtitle: 'Give a pet a home'
      }
    };

    const viewport = document.getElementById('viewport');
    const scene = document.getElementById('scene');
    const composition = document.getElementById('composition');
    const nav = document.querySelector('.nav');
    const help = document.querySelector('[data-nav="help"]');
    const charity = document.querySelector('[data-nav="charity"]');
    const dropdown = document.querySelector('.dropdown');
    const firstRow = document.querySelector('[data-row="0"]');
    const activeLine = document.querySelector('.active-line');
    const cursorDefault = document.getElementById('cursorDefault');
    const cursorPointer = document.getElementById('cursorPointer');

    let language = 'ru';
    let loopStart = performance.now();
    let previousPhase = '';

    function resizeScene() {
      const scale = viewport.clientWidth / 1000;
      scene.style.transform = 'scale(' + scale + ')';
    }

    function fitNavigation() {
      nav.style.setProperty('--nav-font-size', '16px');
    }

    function setActiveLine(target, immediate = false) {
      const left = target.offsetLeft;
      const width = target.querySelector('.nav-label').offsetWidth;
      if (immediate) activeLine.style.transition = 'none';
      activeLine.style.left = left + 'px';
      activeLine.style.width = width + 'px';
      if (immediate) requestAnimationFrame(() => activeLine.style.transition = '');
    }

    function setLanguage(nextLanguage) {
      if (!translations[nextLanguage]) return;
      language = nextLanguage;
      document.documentElement.lang = nextLanguage;
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = translations[nextLanguage][node.dataset.i18n];
      });
      fitNavigation();
      const activeIsCharity = [
        'open', 'moveToItem', 'itemHover', 'itemSelected',
        'moveToHelp', 'helpHover'
      ].includes(previousPhase);
      setActiveLine(activeIsCharity ? charity : help, true);
    }
    window.setAnimationLanguage = setLanguage;
    window.animationTranslations = translations;

    function rectCenter(element, xBias = .5, yBias = .5) {
      const compositionRect = composition.getBoundingClientRect();
      const rect = element.getBoundingClientRect();
      const scale = viewport.clientWidth / 1000 * 1.18;
      return {
        x: (rect.left - compositionRect.left) / scale + rect.width / scale * xBias,
        y: (rect.top - compositionRect.top) / scale + rect.height / scale * yBias
      };
    }

    function smootherStep(value) {
      const t = Math.max(0, Math.min(1, value));
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    function mix(a, b, t) { return a + (b - a) * smootherStep(t); }

    function setCursorPosition(cursor, from, to, progress, scale = 1) {
      const x = mix(from.x, to.x, progress);
      const y = mix(from.y, to.y, progress);
      cursor.style.transform =
        'translate3d(' + x + 'px,' + y + 'px,0) scale(' + scale + ')';
    }

    function pressScale(elapsed, start, duration = .22) {
      const progress = Math.max(0, Math.min(1, (elapsed - start) / duration));
      return 1 - Math.sin(progress * Math.PI) * .14;
    }

    function applyPhase(phase) {
      if (phase === previousPhase) return;
      previousPhase = phase;
      const menuOpen = [
        'open', 'moveToItem', 'itemHover', 'itemSelected',
        'moveToHelp', 'helpHover'
      ].includes(phase);
      charity.classList.toggle('open', menuOpen);
      dropdown.classList.toggle('visible', menuOpen);
      charity.classList.toggle('hovered', phase === 'charityHover');
      help.classList.toggle('hovered', phase === 'helpHover');
      firstRow.classList.toggle('hovered', ['itemHover', 'itemSelected'].includes(phase));
      firstRow.classList.toggle('selected', [
        'itemSelected', 'moveToHelp', 'helpHover'
      ].includes(phase));
      cursorDefault.style.opacity = [
        'intro', 'moveToCharity', 'returnToStart', 'reset'
      ].includes(phase) ? '1' : '0';
      cursorPointer.style.opacity = [
        'charityHover', 'open', 'moveToItem', 'itemHover',
        'itemSelected', 'moveToHelp', 'helpHover', 'closing'
      ].includes(phase) ? '1' : '0';
      setActiveLine(menuOpen ? charity : help);
    }

    function animate(now) {
      const elapsed = ((now - loopStart) % 6800) / 1000;
      const start = { x: 355, y: 463 };
      const navTarget = rectCenter(charity, .55, .55);
      const rowTarget = rectCenter(firstRow, .78, .55);
      const helpTarget = rectCenter(help, .55, .55);
      let phase = 'intro';

      if (elapsed >= .50 && elapsed < 1.30) phase = 'moveToCharity';
      else if (elapsed >= 1.30 && elapsed < 1.65) phase = 'charityHover';
      else if (elapsed >= 1.65 && elapsed < 2.00) phase = 'open';
      else if (elapsed >= 2.00 && elapsed < 2.90) phase = 'moveToItem';
      else if (elapsed >= 2.90 && elapsed < 3.25) phase = 'itemHover';
      else if (elapsed >= 3.25 && elapsed < 3.70) phase = 'itemSelected';
      else if (elapsed >= 3.70 && elapsed < 4.75) phase = 'moveToHelp';
      else if (elapsed >= 4.75 && elapsed < 5.10) phase = 'helpHover';
      else if (elapsed >= 5.10 && elapsed < 5.40) phase = 'closing';
      else if (elapsed >= 5.40 && elapsed < 6.40) phase = 'returnToStart';
      else if (elapsed >= 6.40) phase = 'reset';

      applyPhase(phase);

      if (phase === 'intro') {
        setCursorPosition(cursorDefault, start, start, 0);
        setCursorPosition(cursorPointer, start, start, 0);
      } else if (phase === 'moveToCharity') {
        const p = (elapsed - .50) / .80;
        setCursorPosition(cursorDefault, start, navTarget, p);
        setCursorPosition(cursorPointer, start, navTarget, p);
      } else if (['charityHover', 'open'].includes(phase)) {
        const scale = phase === 'open' ? pressScale(elapsed, 1.65) : 1;
        setCursorPosition(cursorDefault, navTarget, navTarget, 1);
        setCursorPosition(cursorPointer, navTarget, navTarget, 1, scale);
      } else if (['moveToItem', 'itemHover', 'itemSelected'].includes(phase)) {
        const p = phase === 'moveToItem' ? (elapsed - 2.00) / .90 : 1;
        const scale = phase === 'itemSelected' ? pressScale(elapsed, 3.25) : 1;
        setCursorPosition(cursorPointer, navTarget, rowTarget, p, scale);
      } else if (['moveToHelp', 'helpHover', 'closing'].includes(phase)) {
        const p = phase === 'moveToHelp' ? (elapsed - 3.70) / 1.05 : 1;
        const scale = phase === 'closing' ? pressScale(elapsed, 5.10) : 1;
        setCursorPosition(cursorPointer, rowTarget, helpTarget, p, scale);
        setCursorPosition(cursorDefault, rowTarget, helpTarget, p);
      } else if (['returnToStart', 'reset'].includes(phase)) {
        const p = phase === 'returnToStart' ? (elapsed - 5.40) / 1 : 1;
        setCursorPosition(cursorDefault, helpTarget, start, p);
        setCursorPosition(cursorPointer, helpTarget, start, p);
      }

      requestAnimationFrame(animate);
    }

    new ResizeObserver(resizeScene).observe(viewport);
    setLanguage(new URLSearchParams(location.search).get('lang') || 'ru');
    resizeScene();
    requestAnimationFrame(animate);
  </script>
