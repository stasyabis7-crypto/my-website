<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Success Screens Rework</title>
<style>
@font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"CoFo Avito Text";src:url("../fonts/CoFoAvitoText-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}:root{--ease:cubic-bezier(.22,.61,.36,1);--black:#141414;--soft:#f2f1f0}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"CoFo Avito Text",Arial,sans-serif;color:#000}.stage{position:relative;width:2000px;height:1000px;overflow:hidden;background:linear-gradient(120deg,#cff4ff 0%,#e2ffd6 48%,#cceeff 100%);isolation:isolate}.stage:before,.stage:after{content:"";position:absolute;z-index:-2;border-radius:50%;filter:blur(2px);will-change:transform}.stage:before{width:1180px;height:1180px;left:-250px;top:-580px;background:radial-gradient(circle at 62% 60%,rgba(255,255,255,.8),rgba(163,225,255,.62) 42%,rgba(96,207,255,.12) 68%,transparent 69%);animation:drift-a 11s ease-in-out infinite alternate}.stage:after{width:1260px;height:1260px;right:-320px;bottom:-700px;background:radial-gradient(circle at 38% 35%,rgba(255,255,255,.7),rgba(172,255,149,.56) 43%,rgba(66,225,164,.08) 70%,transparent 71%);animation:drift-b 13s ease-in-out infinite alternate}.ribbon{position:absolute;z-index:-1;left:-8%;top:43%;width:116%;height:230px;border-radius:50%;border:72px solid rgba(255,255,255,.28);transform:rotate(-6deg);animation:ribbon 10s ease-in-out infinite alternate}.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 20px 60px rgba(25,145,174,.12);animation:float 6s ease-in-out infinite}.orb.one{left:250px;top:650px;width:90px;height:90px}.orb.two{right:310px;top:130px;width:132px;height:132px;animation-delay:-2.4s}.modal{position:absolute;left:50%;top:50%;width:650px;height:900px;padding:42px 48px 44px;border-radius:34px;background:#fff;box-shadow:0 32px 90px rgba(15,62,72,.2),0 4px 18px rgba(0,0,0,.1);transform:translate(-50%,-50%);overflow:hidden;animation:modal-loop 8.6s var(--ease) infinite}.close{position:absolute;z-index:5;right:24px;top:19px;width:30px;height:42px;object-fit:contain}.hero{position:relative;width:554px;height:236px;margin:0 auto 22px;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#dff7ff 7%,#e2ffd6 83%)}.hero:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 94%)}.hero-glow{position:absolute;width:460px;height:460px;left:47px;top:-235px;border:52px solid rgba(255,255,255,.5);border-radius:50%;animation:hero-ring 8.6s ease-in-out infinite}.success-visual{position:absolute;z-index:2;left:50%;top:50%;width:224px;height:176px;transform:translate(-50%,-48%)}.success-check{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(0,145,73,.15));animation:check-loop 8.6s var(--ease) infinite}.fund-logo{position:absolute;right:6px;bottom:4px;width:76px;height:76px;padding:9px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 10px 28px rgba(0,0,0,.16);animation:logo-loop 8.6s var(--ease) infinite}.content{animation:content-loop 8.6s var(--ease) infinite}.title{margin:0 0 8px;font-size:32px;line-height:36px;font-weight:800;letter-spacing:-.35px}.subtitle{margin:0 0 22px;font-size:19px;line-height:27px}.actions{display:grid;gap:9px}.button{height:64px;border:0;border-radius:20px;font:500 19px/24px "CoFo Avito Text",Arial}.button.primary{background:var(--black);color:#fff}.button.secondary{background:var(--soft);color:#000}.divider{height:2px;margin:28px -48px 22px;background:var(--soft)}.share-title{margin:0 0 4px;font-size:23px;line-height:28px;font-weight:800}.share-copy{margin:0;font-size:18px;line-height:26px}.socials{display:flex;gap:9px;margin-top:18px}.social{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;animation:social-loop 8.6s var(--ease) infinite}.social:nth-child(2){animation-delay:.08s}.social:nth-child(3){animation-delay:.16s}.social img{width:28px;height:28px;object-fit:contain}.social:first-child img{width:24px;height:24px}@keyframes modal-loop{0%,4%{opacity:0;transform:translate(-50%,-46%) scale(.92)}12%,82%{opacity:1;transform:translate(-50%,-50%) scale(1)}92%,100%{opacity:0;transform:translate(-50%,-53%) scale(.965)}}@keyframes check-loop{0%,11%{opacity:0;transform:scale(.7) rotate(-7deg)}23%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:scale(.94)}}@keyframes logo-loop{0%,20%{opacity:0;transform:translate(18px,-18px) scale(.7) rotate(9deg)}31%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:scale(.9)}}@keyframes content-loop{0%,23%{opacity:0;transform:translateY(20px)}34%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-8px)}}@keyframes social-loop{0%,39%{opacity:0;transform:translateY(12px) scale(.8)}50%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:scale(.9)}}@keyframes hero-ring{0%,100%{transform:translateX(-26px) rotate(-8deg)}50%{transform:translateX(30px) rotate(7deg)}}@keyframes drift-a{to{transform:translate(170px,90px) scale(1.08)}}@keyframes drift-b{to{transform:translate(-150px,-70px) scale(1.06)}}@keyframes ribbon{to{transform:translateY(-38px) rotate(3deg)}}@keyframes float{50%{transform:translateY(-28px) scale(1.08)}}@media(prefers-reduced-motion:reduce){.modal,.success-check,.fund-logo,.content,.social,.hero-glow,.stage:before,.stage:after,.ribbon,.orb{animation:none!important}.modal,.success-check,.fund-logo,.content,.social{opacity:1!important;transform:none}.modal{transform:translate(-50%,-50%)!important}}
.stage{background:linear-gradient(120deg,#c9f3ff 0%,#e7ffe0 52%,#ccf4e5 100%);background-size:160% 160%;animation:plain-gradient 12s ease-in-out infinite;isolation:auto}.stage:before,.stage:after,.ribbon,.orb{display:none}.modal{height:auto;padding:0}.hero{width:100%;height:236px;margin:0;border-radius:0;background:linear-gradient(120deg,#dff7ff 0%,#e8ffe1 100%)}.hero-glow{display:none}.content{padding:22px 48px 44px}.divider{margin-left:-48px;margin-right:-48px}@keyframes plain-gradient{0%,100%{background-position:0 40%}50%{background-position:100% 60%}}
</style>
</head>
<body>
<main class="stage">
  <article class="modal">
    <img class="close" src="../03-donation-flow/Close.svg" alt="Закрыть">
    <div class="hero"><i class="hero-glow"></i><div class="success-visual"><img class="success-check" src="../03-donation-flow/success-check.webp" alt=""><img class="fund-logo" src="../03-donation-flow/fund-logo.webp" alt="Российский Красный Крест"></div></div>
    <div class="content">
      <h1 class="title">Отправили 100 ₽ в фонд<br>«Российский Красный Крест»</h1>
      <p class="subtitle">Благодаря вам люди получают помощь в экстренных ситуациях</p>
      <div class="actions"><button class="button primary">Добавить значок на объявление</button><button class="button secondary">Как помогать регулярно</button></div>
      <div class="divider"></div>
      <h2 class="share-title">Помогать вместе — приятнее</h2>
      <p class="share-copy">Поделитесь ссылкой с близкими. Пусть добрых дел<br>станет больше 💚</p>
      <div class="socials"><span class="social"><img src="../03-donation-flow/link.svg" alt="Копировать ссылку"></span><span class="social"><img src="../03-donation-flow/telegram.svg" alt="Telegram"></span><span class="social"><img src="../03-donation-flow/vk.svg" alt="VK"></span></div>
    </div>
  </article>
</main>
</body>
</html>
