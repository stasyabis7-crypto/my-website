<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>my-website</title>
<!-- Ставит data-theme на <html> до первой отрисовки — без этого у тех,
     кто уже переключался на светлую тему, при заходе мелькнёт тёмная
     (дефолтная) перед переключением на сохранённую светлую. -->

<script src="styles/theme.js"></script>
<link rel="stylesheet" href="styles/scale.css" />
<link rel="stylesheet" href="styles/typography.css" />
<link rel="stylesheet" href="styles/theme.css" />
<link rel="stylesheet" href="styles/header.css" />
<link rel="stylesheet" href="styles/footer.css" />
<link rel="stylesheet" href="styles/theme-toggle.css" />
<link rel="stylesheet" href="styles/masonry.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }

  /*
    --page-px — общий горизонтальный отступ страницы: хедер, контент и
    футер читают его через var(), поэтому всегда выровнены по одной
    вертикали. Брейкпоинты планшет/десктоп (800+), мобильный диапазон
    (390–800, см. scale.css) не трогаем.
  */
  :root {
    --page-px: 1.5rem;
  }

  .container {
    max-width: 90rem;
    margin-inline: auto;
    padding-inline: var(--page-px);
  }

  .page-works {
    padding-block: 2rem 4rem;
  }

  /*
    Хедер/футер зафиксированы (см. header.css/footer.css) — на моб/
    планшете это полноширинные бары сверху/снизу, поэтому контенту
    нужны отступы, чтобы не прятаться под ними. Реальную высоту бара
    считает layout-chrome.js (--header-h/--footer-h), тут — запасное
    значение на случай, если JS ещё не отработал.
  */
  @media (max-width: 1100.98px) {
    body {
      padding-top: var(--header-h, 3.5rem);
      padding-bottom: var(--footer-h, 3.5rem);
    }
  }

  @media (min-width: 800px) {
    :root { --page-px: 2rem; }
  }

  @media (min-width: 1101px) {
    :root { --page-px: 3rem; }

    /* Десктоп — хедер/футер уже не бары, а плавающие плашки в углах,
       отступ под них не нужен, но контенту нужен небольшой запас
       сверху, чтобы плашка хедера не наезжала на первый ряд галереи. */
    .page-works {
      padding-top: 6rem;
    }
  }

  @media (min-width: 1441px) {
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__identity">
      <div class="site-header__avatar">
        <!-- <img src="assets/avatar.jpg" alt="Имя Фамилия" /> -->
      </div>
      <a href="#" class="site-header__logo text-h4">Имя Фамилия</a>
    </div>
    <a href="assets/resume.pdf" class="site-header__cta text-button" download>Резюме PDF</a>
  </header>

  <!-- Отдельная плашка, специально не внутри .site-header — см. theme-toggle.css. -->
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
    <span class="theme-toggle__icon" aria-hidden="true">☀</span>
  </button>

  <main class="container page-works">
    <h1 class="text-h1">Работы</h1>

    <!--
      Карточки .masonry__item — data-ratio задаёт пропорцию (см. гайд по
      подготовке кадров). Вместо пустого блока внутри кладите <img
      src="..." alt="..."> — растянется через object-fit: cover.
    -->
    <div class="masonry" id="works-gallery">
      <div class="masonry__item" data-ratio="4/5"></div>
      <div class="masonry__item" data-ratio="1/1"></div>
      <div class="masonry__item" data-ratio="3/2"></div>
      <div class="masonry__item" data-ratio="2/3"></div>
      <div class="masonry__item" data-ratio="4/3"></div>
      <div class="masonry__item" data-ratio="1/1"></div>
      <div class="masonry__item" data-ratio="4/5"></div>
      <div class="masonry__item" data-ratio="16/9"></div>
    </div>
  </main>

  <footer class="site-footer">
    <nav class="site-footer__nav-wrap">
      <ul class="site-footer__nav">
        <li><a href="#" class="site-footer__link text-label is-current">Работы</a></li>
        <li><a href="#" class="site-footer__link text-label">Обо мне</a></li>
        <li><a href="#" class="site-footer__link text-label">Активности</a></li>
        <li><a href="#" class="site-footer__link text-label">Контакты</a></li>
      </ul>
    </nav>
    <!-- Моб/планшет: видно только когда футер свёрнут при скролле. -->
    <button type="button" class="site-footer__menu-btn text-button" aria-label="Меню">Меню</button>
    <button type="button" class="site-footer__top-btn" aria-label="Наверх">↑</button>
  </footer>

  <script src="styles/masonry.js"></script>
  <script src="styles/layout-chrome.js"></script>
</body>
</html>
