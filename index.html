<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }

  /*
    --page-px — общий горизонтальный отступ страницы: хедер, контент и
    футер читают его через var(), поэтому всегда выровнены по одной
    вертикали. Фиксированные 10px везде (не резинится по брейкпоинтам).
  */
  :root {
    --page-px: 10px;
  }

  .container {
    max-width: 90rem;
    margin-inline: auto;
    padding-inline: var(--page-px);
  }

  .page-works {
    /* Верхний зазор до карточек уже даёт body (page-px + высота
       хедера + 10px, см. ниже) — здесь лишний padding-top только
       задваивал бы его. Нижний оставляем как есть. */
    padding-block: 0 4rem;
  }

  /*
    Хедер/футер — всегда плавающие плашки с отступом var(--page-px) от
    края (см. header.css/footer.css), поэтому контенту нужен запас
    сверху/снизу, чтобы не прятаться под ними: отступ страницы + сама
    высота плашки. Реальную высоту плашки считает layout-chrome.js
    (--header-h/--footer-h), тут — запасное значение на случай, если
    JS ещё не отработал.

    По умолчанию (моб/планшет, а также html.chrome--compact — откат
    с десктопа при коллизии плашек, см. layout-chrome.js) — это
    правило работает всегда. На десктопе (см. медиа-запрос ниже) оно
    выключается, потому что там плашки сжаты по контенту и не мешают
    контенту снизу/сверху почти совсем.
  */
  body {
    padding-top: calc(var(--page-px) + var(--header-h, 3.5rem) + 10px);
    padding-bottom: calc(var(--page-px) + var(--footer-h, 3.5rem));
  }

  @media (min-width: 1101px) {
    /* Десктоп — хедер/футер сжаты до плашек по контенту в углах,
       полноразмерный отступ тела не нужен, но контенту нужен
       небольшой запас сверху, чтобы плашка хедера не наезжала на
       первый ряд галереи — ровно те же 10px, что и на моб/планшете,
       по той же формуле (page-px + реальная высота хедера + 10px).
       html:not(.chrome--compact) — см. header.css: если бы плашки не
       влезли в ряд, откатываемся на моб-вариант (и тогда правило выше
       снова в силе). */
    html:not(.chrome--compact) body {
      padding-top: 0;
      padding-bottom: 0;
    }

    html:not(.chrome--compact) .page-works {
      padding-top: calc(var(--page-px) + var(--header-h, 3.5rem) + 10px);
    }
  }

  @media (min-width: 1441px) {
  }
</style>

         скроллит страницу наверх. -->
    <button
      type="button"
      class="site-footer__menu-btn"
      id="footer-menu-btn"
      aria-haspopup="true"
      aria-expanded="false"
      aria-controls="footer-menu-panel"
      aria-label="Меню"
    >
      <span class="icon icon--menu" aria-hidden="true"></span>
    </button>
    <!-- Кнопка "наверх" — при открытом меню (.is-menu-open) приглушается
         (см. footer.css), закрывает меню теперь кнопка "Меню" слева —
         она сама превращается в крестик, см. layout-chrome.js/footer.css. -->
    <button type="button" class="site-footer__top-btn" id="footer-top-btn" aria-label="Наверх">
      <span class="icon icon--up" aria-hidden="true"></span>
    </button>
  </footer>

  <!--
    Подложка при открытом моб/планшет-меню — блюрит и блокирует всё,
    кроме кнопки "Меню" (она же кнопка "закрыть", пока меню открыто —
    см. .site-footer__menu-btn выше) и самой плашки меню (см.
    .footer-menu-backdrop/.site-footer.is-menu-open в footer.css и
    open/closeMenu в layout-chrome.js — та же логика клика мимо уже
    закрывает меню при клике по подложке).
  -->
  <div class="footer-menu-backdrop" id="footer-menu-backdrop" hidden></div>

  <!--
    Плашка-меню (моб/планшет) — намеренно вне <footer>, чтобы висеть
    отдельно над кнопкой "Меню". Сетка 2×2 (см. .footer-menu-panel__nav
    в footer.css), пункты того же размера, что и в развёрнутом футере.
    Сжата по контенту и прибита к левому краю экрана — не растянута
    на всю ширину футера.
  -->
  <div class="footer-menu-panel" id="footer-menu-panel" hidden>
    <nav class="footer-menu-panel__bar">
      <ul class="footer-menu-panel__nav">
        <li><a href="#" class="footer-menu-panel__link text-label is-current">
          <span class="icon icon--works" aria-hidden="true"></span>
          Работы
        </a></li>
        <li><a href="#" class="footer-menu-panel__link text-label">
          <span class="icon icon--about" aria-hidden="true"></span>
          Обо мне
        </a></li>
        <li><a href="#" class="footer-menu-panel__link text-label">
          <span class="icon icon--activities" aria-hidden="true"></span>
          Активности
        </a></li>
        <li><a href="#" class="footer-menu-panel__link text-label">
          <span class="icon icon--contacts" aria-hidden="true"></span>
          Контакты
        </a></li>
      </ul>
    </nav>
  </div>

  <script src="styles/masonry.js?v=20"></script>
  <script src="styles/layout-chrome.js?v=21"></script>
  <script src="styles/embed-scale.js?v=18"></script>
  <script src="styles/loading.js?v=1"></script>
  <script src="styles/typography-rules.js?v=1"></script>
  <script src="styles/haptics.js?v=1"></script>
</body>
</html>
