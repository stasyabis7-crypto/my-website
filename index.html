<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    /* Страховка от горизонтального скролла: .hero (см. hero.css) —
       full-bleed через 100vw + отрицательный margin, а vw считается от
       ширины окна вместе с полосой прокрутки, тогда как % — уже без
       неё. На системах, где полоса прокрутки резервирует место (не
       overlay — Windows/Linux, или macOS с мышью вместо тачпада), это
       даёт .hero лишние пиксели вправо и появляется горизонтальный
       скролл страницы. */
    overflow-x: hidden;
  }

  /*
    --page-px — общий горизонтальный отступ страницы: хедер, контент и
    футер читают его через var(), поэтому всегда выровнены по одной
    вертикали. Фиксированные 10px везде (не резинится по брейкпоинтам).
  */
  :root {
    --page-px: 10px;
  }

  .container {
    max-width: 90rem;
    margin-inline: auto;
    padding-inline: var(--page-px);
  }

  .page-works {
    /* Верхний зазор до карточек уже даёт body (page-px + высота
       хедера + 10px, см. ниже) — здесь лишний padding-top только
       задваивал бы его. Нижний оставляем как есть. */
    padding-block: 0 4rem;
  }

  /*
    Хедер/футер — всегда плавающие плашки с отступом var(--page-px) от
    края (см. header.css/footer.css), поэтому контенту нужен запас
    сверху/снизу, чтобы не прятаться под ними: отступ страницы + сама
    высота плашки. Реальную высоту плашки считает layout-chrome.js
    (--header-h/--footer-h), тут — запасное значение на случай, если
    JS ещё не отработал.

    По умолчанию (моб/планшет, а также html.chrome--compact — откат
    с десктопа при коллизии плашек, см. layout-chrome.js) — это
    правило работает всегда. На десктопе (см. медиа-запрос ниже) оно
    выключается, потому что там плашки сжаты по контенту и не мешают
    контенту снизу/сверху почти совсем.
  */
  body {
    padding-top: calc(var(--page-px) + var(--header-h, 3.5rem) + 10px);
    padding-bottom: calc(var(--page-px) + var(--footer-h, 3.5rem));
  }

  @media (min-width: 1101px) {
    /* Десктоп — хедер/футер сжаты до плашек по контенту в углах,
       полноразмерный отступ тела не нужен, но контенту нужен
       небольшой запас сверху, чтобы плашка хедера не наезжала на
       первый ряд галереи — ровно те же 10px, что и на моб/планшете,
       по той же формуле (page-px + реальная высота хедера + 10px).
       html:not(.chrome--compact) — см. header.css: если бы плашки не
       влезли в ряд, откатываемся на моб-вариант (и тогда правило выше
       снова в силе). */
    html:not(.chrome--compact) body {
      padding-top: 0;
      padding-bottom: 0;
    }

    html:not(.chrome--compact) .page-works {
      padding-top: calc(var(--page-px) + var(--header-h, 3.5rem) + 10px);
    }
  }

  @media (min-width: 1441px) {
  }
</style>

  <!-- Liquid glass — SVG-фильтр для хедера/футера/тумблера/кнопки
       "наверх" (см. --liquid-glass-filter в theme.css). Процедурный
       шум, не завязан на форму/размер конкретной плашки — один и тот
       же фильтр переиспользуют все четыре. Цифры подобраны на
       storybook/liquid-glass-sample.html, менять лучше там же. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-glass-distort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.006" numOctaves="1" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="0.5" result="blurredNoise" />
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="78" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- WebKit (весь мобильный Safari/Chrome/Firefox на iOS — там все
       браузеры обязаны работать на движке Safari) не умеет ссылаться на
       SVG-фильтр внутри backdrop-filter: вместо того чтобы пропустить
       непонятную часть, он бракует ЦЕЛИКОМ всё значение и откатывается
       на none — стекло пропадает совсем, не только "рябь". Проверяем на
       реальном пробнике (быстрее и надёжнее @supports — тот в WebKit
       считает синтаксис валидным, хотя рендерит none) и, если фильтр не
       применился, переключаем --liquid-glass-filter на упрощённый рецепт
       без url() — см. .no-liquid-glass-distort в theme.css. Синхронно и
       сразу после SVG-фильтра выше, чтобы не было вспышки "живого"
       незастекленного хедера перед переключением. -->
  <script>
    (function () {
      // Через var(), не литералом — прямой литерал WebKit парсит
      // нормально, ломается именно подстановка url() из custom property
      // (см. чат), а хедер/футер/тумблер/кнопка читают именно var().
      var probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;--p:blur(1px) url(#liquid-glass-distort);backdrop-filter:var(--p);-webkit-backdrop-filter:var(--p)';
      document.body.appendChild(probe);
      var cs = getComputedStyle(probe);
      var applied = cs.backdropFilter || cs.webkitBackdropFilter || '';
      document.body.removeChild(probe);
      if (!applied || applied === 'none') {
        document.documentElement.classList.add('no-liquid-glass-distort');
      }
    })();
  </script>

          <span class="icon icon--contacts" aria-hidden="true"></span>
          Контакты
        </a></li>
      </ul>
    </nav>
    <!-- Свёрнутое (при скролле) состояние моб/планшета: кнопка "Меню"
         слева открывает панель ниже, кнопка со стрелкой вверх справа
         скроллит страницу наверх. -->
    <button
      type="button"
      class="site-footer__menu-btn"
      id="footer-menu-btn"
      aria-haspopup="true"
      aria-expanded="false"
      aria-controls="footer-menu-panel"
      aria-label="Меню"
    >
      <span class="site-footer__menu-btn-line site-footer__menu-btn-line--top" aria-hidden="true"></span>
      <span class="site-footer__menu-btn-line site-footer__menu-btn-line--center" aria-hidden="true"></span>
      <span class="site-footer__menu-btn-line site-footer__menu-btn-line--bottom" aria-hidden="true"></span>
    </button>
    <!-- Кнопка "наверх" — при открытом меню (.is-menu-open) приглушается
         (см. footer.css), закрывает меню теперь кнопка "Меню" слева —
         она сама превращается в крестик, см. layout-chrome.js/footer.css. -->
    <button type="button" class="site-footer__top-btn" id="footer-top-btn" aria-label="Наверх">
      <span class="icon icon--up" aria-hidden="true"></span>
    </button>
  </footer>

  <!-- Кнопка "наверх" на десктопе — вне <footer> нарочно, см.
       #footer-top-btn-desktop в footer.css (position:fixed внутри
       футера считался бы от самой плашки, не от вьюпорта, из-за её
       backdrop-filter). Скрыта на моб/планшете (там свою роль играет
       кнопка внутри футера выше), появляется/обработчик клика — см.
       layout-chrome.js. -->
  <button type="button" class="site-footer__top-btn" id="footer-top-btn-desktop" aria-label="Наверх">
    <span class="icon icon--up" aria-hidden="true"></span>
  </button>

  <!--
    Подложка при открытом моб/планшет-меню — блюрит и блокирует всё,
    кроме кнопки "Меню" (она же кнопка "закрыть", пока меню открыто —
    см. .site-footer__menu-btn выше) и самой плашки меню (см.
    .footer-menu-backdrop/.site-footer.is-menu-open в footer.css и
    open/closeMenu в layout-chrome.js — та же логика клика мимо уже
    закрывает меню при клике по подложке).
  -->
  <div class="footer-menu-backdrop" id="footer-menu-backdrop" hidden></div>

  <!--
    Плашка-меню (моб/планшет) — намеренно вне <footer>, чтобы висеть
    отдельно над кнопкой "Меню". Сетка (см. .footer-menu-panel__nav
    в footer.css), пункты того же размера, что и в развёрнутом футере.
    Сжата по контенту и центрирована — не растянута на всю ширину
    футера.
  -->
  <div class="footer-menu-panel" id="footer-menu-panel" hidden>
    <nav class="footer-menu-panel__bar">
      <ul class="footer-menu-panel__nav">
        <li><a href="index.html" class="footer-menu-panel__link text-label is-current">
          <span class="icon icon--works" aria-hidden="true"></span>
          Работы
        </a></li>
        <li hidden><a href="#" class="footer-menu-panel__link text-label">
          <span class="icon icon--activities" aria-hidden="true"></span>
          Активности
        </a></li>
        <li hidden><a href="#" class="footer-menu-panel__link text-label">
          <span class="icon icon--contacts" aria-hidden="true"></span>
          Контакты
        </a></li>
      </ul>
    </nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="styles/hero.js?v=1"></script>
  <script src="styles/layout-chrome.js?v=22"></script>
  <script src="styles/embed-scale.js?v=19"></script>
  <script src="styles/works-anim-gate.js?v=2"></script>
  <script src="styles/loading.js?v=2"></script>
  <script src="styles/typography-rules.js?v=1"></script>
  <script src="styles/haptics.js?v=1"></script>
</body>
</html>
