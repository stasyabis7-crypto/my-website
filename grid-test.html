<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grid v2 — примерка</title>
<link rel="stylesheet" href="styles/theme.css?v=23" />
<link rel="stylesheet" href="styles/works-grid-v2.css?v=6" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wg__ph {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, transparent 10px 20px);
  }
  .wg__row--big .wg__ph b { color: #ffb020; }
  .wg__row--el3 .wg__ph b { color: #6fd0ff; }
  .wg__row--sq2 .wg__ph b { color: #9dff8f; }
  .wg__row--sq3 .wg__ph b { color: #ff8fd0; }
</style>
</head>
<body>

<div class="wg" id="wg"></div>

<script>
  // Реальный список проектов (2026-08-26), сгруппированный в строки
  // по заявленным типам. big — 1 большой на всю ширину, el3 — 3
  // вытянутых вертикальных в строке, sq2 — 2 больших квадрата в
  // строке, sq3 — 3 маленьких квадрата в строке.
  var ROWS = [
    { type: "big", items: ["Recycle map"] },
    { type: "el3", items: ["About company", "Checkout subscription", "Ihelp in profile"] },
    { type: "sq2", items: ["Banners with new branding charity", "ESG report"] },
    { type: "big", items: ["CRM system"] },
    { type: "sq2", items: ["Customer portrait", "Prices table"] },
    { type: "el3", items: ["Boosting in the app", "VAT", "Minimal price"] },
    { type: "sq2", items: ["Photoshop post", "Boosting prices"] },
    { type: "big", items: ["Wild nature"] },
    { type: "el3", items: ["ihelp SPEF", "Donation flow", "Gamification portal"] },
    { type: "big", items: ["Hero banner ihelp"] },
    { type: "sq3", items: ["Blanket post", "Where is money post", "Silver wishes post"] },
    { type: "big", items: ["It volunteering"] },
    { type: "big", items: ["Angel project for HR"] },
    { type: "el3", items: ["Onboarding", "Medical app gamification", "Medical app watch"] },
    { type: "big", items: ["Dashboard for doctors"] },
    { type: "big", items: ["Dashboard concept"] },
    { type: "el3", items: ["Educational app", "Mail app", "Share project"] },
    { type: "big", items: ["TLM landing"] },
    { type: "big", items: ["Music controller"] },
    { type: "sq2", items: ["Object settings", "Your custom"] },
    { type: "sq2", items: ["Time warp", "Flecto"] },
    { type: "big", items: ["Offer story"] },
    { type: "big", items: ["Ai assistant"] }
  ];
  var LABEL = { big: "1 большой", el3: "3 вытянутых", sq2: "2 квадрата", sq3: "3 квадрата" };

  // Реальные ассеты, загруженные в grid-test-assets/{слот}-{slug}/cover.*
  // — по мере загрузки новых просто добавляйте сюда номер слота.
  var ASSETS = {
    1: { type: "image", src: "grid-test-assets/01-recycle-map/cover.png" },
    2: { type: "image", src: "grid-test-assets/02-about-company/cover.png" },
    3: { type: "image", src: "grid-test-assets/03-checkout-subscription/cover.png" },
    4: { type: "image", src: "grid-test-assets/04-ihelp-in-profile/cover.png" }
  };

  var wg = document.getElementById("wg");
  var slot = 1;
  var videos = [];
  ROWS.forEach(function (rowDef) {
    var row = document.createElement("div");
    row.className = "wg__row wg__row--" + rowDef.type;
    rowDef.items.forEach(function (title) {
      var item = document.createElement("div");
      item.className = "wg__item";
      var asset = ASSETS[slot];
      if (asset && asset.type === "video") {
        var video = document.createElement("video");
        video.className = "wg__video";
        video.src = asset.src;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        item.appendChild(video);
        videos.push(video);
      } else if (asset && asset.type === "image") {
        var img = document.createElement("img");
        img.src = asset.src;
        img.alt = title;
        img.loading = "lazy";
        item.appendChild(img);
      } else {
        item.innerHTML =
          '<span class="wg__ph"><b>' + slot + ". " + title + '</b><span>' +
          LABEL[rowDef.type] + "</span></span>";
      }
      row.appendChild(item);
      slot++;
    });
    wg.appendChild(row);
  });

  // Играет, только пока карточка во вьюпорте — вне его пауза, чтобы
  // не грузить декодер видео впустую на длинной странице.
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var v = entry.target;
      if (entry.isIntersecting) {
        v.play().catch(function () {});
      } else {
        v.pause();
      }
    });
  }, { threshold: 0.1 });
  videos.forEach(function (v) { io.observe(v); });
</script>

</body>
</html>
