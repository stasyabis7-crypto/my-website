<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grid v2 — примерка</title>
<link rel="stylesheet" href="styles/theme.css?v=23" />
<link rel="stylesheet" href="styles/works-grid-v2.css?v=6" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wg__ph {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, transparent 10px 20px);
  }
  .wg__row--big .wg__ph b { color: #ffb020; }
  .wg__row--el3 .wg__ph b { color: #6fd0ff; }
  .wg__row--sq2 .wg__ph b { color: #9dff8f; }
  .wg__row--sq3 .wg__ph b { color: #ff8fd0; }
</style>
</head>
<body>

<div class="wg" id="wg"></div>

<script>
  // Реальный список проектов (2026-08-26), сгруппированный в строки
  // по заявленным типам. big — 1 большой на всю ширину, el3 — 3
  // вытянутых вертикальных в строке, sq2 — 2 больших квадрата в
  // строке, sq3 — 3 маленьких квадрата в строке.
  var ROWS = [
    { type: "big", items: ["Recycle map"] },
    { type: "el3", items: ["About company", "Checkout subscription", "Ihelp in profile"] },
    { type: "sq2", items: ["Banners with new branding charity", "ESG report"] },
    { type: "big", items: ["CRM system"] },
    { type: "sq2", items: ["Customer portrait", "Prices table"] },
    { type: "el3", items: ["Boosting in the app", "VAT", "Minimal price"] },
    { type: "sq2", items: ["Photoshop post", "Boosting prices"] },
    { type: "big", items: ["Wild nature"] },
    { type: "el3", items: ["ihelp SPEF", "Donation flow", "Gamification portal"] },
    { type: "big", items: ["Hero banner ihelp"] },
    { type: "sq3", items: ["Blanket post", "Where is money post", "Silver wishes post"] },
    { type: "big", items: ["Angel project for HR"] },
    { type: "el3", items: ["Onboarding", "Medical app gamification", "Medical app watch"] },
    { type: "big", items: ["Dashboard for doctors"] },
    { type: "big", items: ["Dashboard concept"] },
    { type: "el3", items: ["Educational app", "Mail app", "Share project"] },
    { type: "big", items: ["TLM landing"] },
    { type: "big", items: ["Music controller"] },
    { type: "sq2", items: ["Object settings", "Your custom"] },
    { type: "sq2", items: ["Time warp", "Flecto"] },
    { type: "big", items: ["Offer story"] },
    { type: "big", items: ["Ai assistant"] }
  ];
  var LABEL = { big: "1 большой", el3: "3 вытянутых", sq2: "2 квадрата", sq3: "3 квадрата" };

  // Реальные ассеты, загруженные в grid-test-assets/{слот}-{slug}/cover.*
  // Привязка по НАЗВАНИЮ проекта (не по номеру слота) — так строки
  // можно убирать/переставлять, не пересчитывая номера вручную.
  var ASSETS = {
    "Recycle map": { type: "image", src: "grid-test-assets/01-recycle-map/cover.png" },
    "About company": { type: "image", src: "grid-test-assets/02-about-company/cover.png" },
    "Checkout subscription": { type: "image", src: "grid-test-assets/03-checkout-subscription/cover.png" },
    "Ihelp in profile": { type: "image", src: "grid-test-assets/04-ihelp-in-profile/cover.png" },
    "Banners with new branding charity": { type: "image", src: "grid-test-assets/05-banners-with-new-branding-charity/cover.png" },
    "ESG report": { type: "image", src: "grid-test-assets/06-esg-report/cover.png" },
    "CRM system": { type: "image", src: "grid-test-assets/07-crm-system/cover.png" },
    "Customer portrait": { type: "image", src: "grid-test-assets/08-customer-portrait/cover.png" },
    "Prices table": { type: "image", src: "grid-test-assets/09-prices-table/cover.png" },
    "Boosting in the app": { type: "image", src: "grid-test-assets/10-boosting-in-the-app/cover.png" },
    "VAT": { type: "image", src: "grid-test-assets/11-vat/cover.png" },
    "Minimal price": { type: "image", src: "grid-test-assets/12-minimal-price/cover.png" },
    "Photoshop post": { type: "image", src: "grid-test-assets/13-photoshop-post/cover.png" },
    "Boosting prices": { type: "image", src: "grid-test-assets/14-boosting-prices/cover.png" },
    "Wild nature": { type: "image", src: "grid-test-assets/15-wild-nature/cover.png" },
    "ihelp SPEF": { type: "image", src: "grid-test-assets/16-ihelp-spef/cover.png" },
    "Donation flow": { type: "image", src: "grid-test-assets/17-donation-flow/cover.png" },
    "Gamification portal": { type: "image", src: "grid-test-assets/18-gamification-portal/cover.png" },
    "Hero banner ihelp": { type: "image", src: "grid-test-assets/19-hero-banner-ihelp/cover.png" },
    "Blanket post": { type: "image", src: "grid-test-assets/20-blanket-post/cover.png" },
    "Where is money post": { type: "image", src: "grid-test-assets/21-where-is-money-post/cover.png" },
    "Silver wishes post": { type: "image", src: "grid-test-assets/22-silver-wishes-post/cover.png" },
    "Angel project for HR": { type: "image", src: "grid-test-assets/24-angel-project-for-hr/cover.png" },
    "Onboarding": { type: "image", src: "grid-test-assets/25-onboarding/cover.png" },
    "Medical app gamification": { type: "image", src: "grid-test-assets/26-medical-app-gamification/cover.png" },
    "Medical app watch": { type: "image", src: "grid-test-assets/27-medical-app-watch/cover.png" },
    "Dashboard for doctors": { type: "image", src: "grid-test-assets/28-dashboard-for-doctors/cover.png" },
    "Dashboard concept": { type: "image", src: "grid-test-assets/29-dashboard-concept/cover.png" },
    "Educational app": { type: "image", src: "grid-test-assets/30-educational-app/cover.png" },
    "Mail app": { type: "image", src: "grid-test-assets/31-mail-app/cover.png" },
    "Share project": { type: "image", src: "grid-test-assets/32-share-project/cover.png" },
    "TLM landing": { type: "image", src: "grid-test-assets/33-tlm-landing/cover.png" },
    "Music controller": { type: "image", src: "grid-test-assets/34-music-controller/cover.png" },
    "Object settings": { type: "image", src: "grid-test-assets/35-object-settings/cover.png" },
    "Your custom": { type: "image", src: "grid-test-assets/36-your-custom/cover.png" },
    "Time warp": { type: "image", src: "grid-test-assets/37-time-warp/cover.png" },
    "Flecto": { type: "image", src: "grid-test-assets/38-flecto/cover.png" },
    "Offer story": { type: "image", src: "grid-test-assets/39-offer-story/cover.png" },
    "Ai assistant": { type: "image", src: "grid-test-assets/40-ai-assistant/cover.png" }
  };

  var wg = document.getElementById("wg");
  var slot = 1;
  var videos = [];
  ROWS.forEach(function (rowDef) {
    var row = document.createElement("div");
    row.className = "wg__row wg__row--" + rowDef.type;
    rowDef.items.forEach(function (title) {
      var item = document.createElement("div");
      item.className = "wg__item";
      var asset = ASSETS[title];
      if (asset && asset.type === "video") {
        var video = document.createElement("video");
        video.className = "wg__video";
        video.src = asset.src;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        item.appendChild(video);
        videos.push(video);
      } else if (asset && asset.type === "image") {
        var img = document.createElement("img");
        img.src = asset.src;
        img.alt = title;
        img.loading = "lazy";
        item.appendChild(img);
      } else {
        item.innerHTML =
          '<span class="wg__ph"><b>' + slot + ". " + title + '</b><span>' +
          LABEL[rowDef.type] + "</span></span>";
      }
      row.appendChild(item);
      slot++;
    });
    wg.appendChild(row);
  });

  // Играет, только пока карточка во вьюпорте — вне его пауза, чтобы
  // не грузить декодер видео впустую на длинной странице.
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var v = entry.target;
      if (entry.isIntersecting) {
        v.play().catch(function () {});
      } else {
        v.pause();
      }
    });
  }, { threshold: 0.1 });
  videos.forEach(function (v) { io.observe(v); });
</script>

</body>
</html>
